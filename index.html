function recordStats(f){
 let wins=f.wins||0,ko=f.winsByKO||0,sub=f.winsBySub||0,dec=f.winsByDecision||0,total=ko+sub+dec;
 if(!total&&wins){dec=wins;total=wins}
 return {ko,sub,dec,total,pko:total?Math.round(ko/total*100):0,psub:total?Math.round(sub/total*100):0,pdec:total?Math.round(dec/total*100):0};
}
function addWinMethod(f,method){
 f.winsByKO=f.winsByKO||0;f.winsBySub=f.winsBySub||0;f.winsByDecision=f.winsByDecision||0;
 if(method==="KO/TKO")f.winsByKO++;else if(method==="Submission")f.winsBySub++;else f.winsByDecision++;
}
function addLossMethod(f,method){
 f.lossesByKO=f.lossesByKO||0;f.lossesBySub=f.lossesBySub||0;f.lossesByDecision=f.lossesByDecision||0;
 if(method==="KO/TKO")f.lossesByKO++;else if(method==="Submission")f.lossesBySub++;else f.lossesByDecision++;

function realisticHistoryFor(f){
 let wins=f.wins||0,loss=f.losses||0;
 f.winsByKO=Math.min(wins,Math.round(wins*rand(18,42)/100));
 f.winsBySub=Math.min(wins-f.winsByKO,Math.round(wins*rand(10,30)/100));
 f.winsByDecision=Math.max(0,wins-f.winsByKO-f.winsBySub);
 f.lossesByKO=Math.min(loss,Math.round(loss*rand(15,35)/100));
 f.lossesBySub=Math.min(loss-f.lossesByKO,Math.round(loss*rand(10,25)/100));

 if(legend)chance=0;
 else if(r<35)chance=required<=48?rand(45,65):required<=58?rand(20,40):rand(5,18);
 else if(r<45)chance=required<=55?rand(55,75):required<=65?rand(30,52):rand(10,25);

function advanceWorld(step){

 let endDay=s.day+step;

function matchmake(){
 let f=currentF();
 if(!f){toast("Выбери бойца");return}
 if(!f.agencyManaged){toast("Сначала подпиши бойца в своё агентство");return}
 if(f.nextFight){toast("У бойца уже есть назначенный бой");return}
 let contracted=!!f.contract;
 let eligibleOrgs=contracted
   ? ORGS.filter(o=>o.name===f.contract.org)
   : ORGS.filter(o=>o.name!=="DWCS" && (s.managerRating||30)>=Math.max(20,o.unlock-10)).filter(o=>!isTopLeague(o.name)||topLeagueEligible(f,o.name));
 let rows=[];
 eligibleOrgs.forEach(org=>{
   let recentOpponents=new Set((f.history||[]).slice(0,3).map(h=>h.opponent).filter(Boolean));
   let pool=s.world.filter(x=>x.weight===f.weight&&!x.agencyManaged&&x.org===org.name&&x.name!==f.name&&!recentOpponents.has(x.name)&&(!isTopLeague(org.name)||topLeagueEligible(x,org.name)));
   // Contracted fighters can only be matched inside their contracted promotion.
   // The same opponent is blocked for the last three completed fights to avoid unrealistic rematches.
   // Rank progression: champions only face top contenders; ranked fighters prefer nearby ranks.
   let fp=getPos(f);
   let isChamp=!!f.title;
   if(pool.length<3){
     pool=s.world.filter(x=>x.weight===f.weight&&!x.agencyManaged&&x.org===org.name&&x.name!==f.name&&(!isTopLeague(org.name)||topLeagueEligible(x,org.name)));
   }
   let opps=pool.filter(x=>{
     let rp=getPos(x);
     if(isChamp) return rp>0&&rp<=8;
     if(fp>0&&fp<=15) return rp>0&&Math.abs(rp-fp)<=8;
     return Math.abs(ovr(x)-ovr(f))<=12;
   }).sort((a,b)=>Math.abs(ovr(a)-ovr(f))-Math.abs(ovr(b)-ovr(f)));
   // Realistic availability: usually only 1-2 viable offers.
   opps.slice(0,2).forEach(o=>{
     let rp=getPos(o), ranked=(fp>0&&fp<=15&&rp>0&&rp<=15);
     let titleFight=isChamp&&rp<=3;
     let fiveRounds=(titleFight||((ranked&&fp<=5&&rp<=5&&org.level>=8)));
     let terms=contractTerms(f,org);
     rows.push({opponent:o,org:org.name,rounds:fiveRounds?5:3,date:s.day+rand(14,42),purse:Math.max(terms.purse,Math.round(terms.purse*.45)),rank:rp,event:choice(["Fight Night","Championship Series","Main Event","Fight Night Series"])+" #"+rand(10,99),ranked,type:titleFight?"ТИТУЛЬНЫЙ БОЙ":(ranked?"РЕЙТИНГОВЫЙ БОЙ":"ОБЫЧНЫЙ БОЙ"),titleFight});
   });
 });
 let candidates=rows.slice(0,2);
 if(!candidates.length){toast(contracted?`В ${f.contract.org} сейчас нет подходящего соперника.`:"Сейчас нет подходящих предложений. Попробуй позже.");return}
 document.getElementById("modal").classList.add("open");
 document.getElementById("sheet").innerHTML=`<div class="eyebrow">${contracted?"КОНТРАК • "+f.contract.org:"РЫНОК БОЁВ • СВОБОДНЫЙ БОЕЦ"}</div>
 <h2>${contracted?"Бои в рамках контракта":"Предложения из разных лиг"}</h2>
 <div class="muted">${f.flag||"🌍"} ${f.name} • ${f.weight} • OVR ${ovr(f)} • ${contracted?`${f.contract.fightsLeft}/${f.contract.length} боя по контракту`:'свободен от лиги'}</div>
 <section class="panel"><div class="notice-strip">${contracted?`У бойца действует контракт с ${f.contract.org}. Другие лиги здесь не участвуют.`:`Это одноразовые бои. После каждого боя лига отдельно решает, предлагать ли долгий контракт.`}</div></section>
 <div class="list" style="margin-top:11px">${candidates.map((c,i)=>`<div class="scout"><div class="fighter-top"><div class="scout-face">${emoji(c.opponent.style)}</div><div class="fighter-info"><div class="fighter-name">${c.opponent.flag||"🌍"} ${c.opponent.name}</div><div class="fighter-sub">${c.opponent.country} • ${c.opponent.style} • ${rec(c.opponent)} • #${c.rank||"—"}</div></div><div class="score">${ovr(c.opponent)}</div></div><div class="tags"><span class="tag">${c.org}</span><span class="tag">${c.type}</span><span class="tag">${c.rounds} раундов</span><span class="tag">${dateLabel(c.date)}</span><span class="tag">+$${c.purse.toLocaleString("ru-RU")}</span></div><div class="scout-actions"><button data-mmprofile="${i}">Профиль</button><button class="primary" data-accept="${i}">Рассмотреть бой</button></div></div>`).join("")}</div><div class="sheet-actions"><button data-close>Закрыть</button></div>`;
 document.querySelectorAll("[data-mmprofile]").forEach(b=>b.onclick=()=>profile(candidates[+b.dataset.mmprofile].opponent,"match"));
 document.querySelectorAll("[data-accept]").forEach(b=>b.onclick=()=>{
   let c=candidates[+b.dataset.accept],min=Math.max(500,Math.round(c.purse*.65)),max=Math.round(c.purse*1.6);
   document.getElementById("sheet").innerHTML=`<div class="eyebrow">ПЕРЕГОВОРЫ О БОЕ</div><div class="title">${f.name} vs ${c.opponent.name}</div><div class="muted">${c.org} • ${c.event} • ${c.rounds} раундов • ${dateLabel(c.date)}</div><section class="panel"><div class="row"><span>Тип</span><b>${c.type}</b></div><div class="row"><span>Гонорар</span><b>$${c.purse.toLocaleString("ru-RU")}</b></div><div style="margin-top:9px"><label class="muted">Твой запрос, $</label><input id="fightSalary" class="input" type="number" min="${min}" max="${max}" value="${c.purse}"></div></section><div class="sheet-actions"><button data-back-mm>Назад</button><button class="primary" data-propose-fight>Предложить бой</button></div>`;
   document.querySelector("[data-back-mm]").onclick=()=>matchmake();
   document.querySelector("[data-propose-fight]").onclick=()=>{
     let purse=Math.max(min,Math.min(max,Number(document.getElementById("fightSalary").value)||c.purse));
     let chance=Math.round(Math.max(15,Math.min(98,82-Math.max(0,purse-c.purse)/Math.max(1,c.purse)*70)));
     if(Math.random()*100>chance){toast("Лига отказалась от условий");return}
     f.fightResolved=false;f.nextFight={opponent:{...c.opponent},org:c.org,event:c.event,rounds:c.rounds,date:c.date,purse,rank:c.rank,ranked:!!c.ranked,type:c.type,titleFight:!!c.titleFight,venue:choice(["Las Vegas Arena","Abu Dhabi Arena","Moscow Arena","Las Vegas","New York","Riyadh Arena"]),card:c.rounds===5?"MAIN EVENT":choice(["PRELIMS","MAIN CARD","CO-MAIN EVENT"]),oneFight:!contracted};
     f.campWeek=1;f.campSchedule={};f.currentFightLeague=c.org;
     logNews(`${f.name} принял бой в ${c.org} против ${c.opponent.name}.`);save();closeModal();page("home");toast(`Бой согласован: ${c.org}`);
   };
 });
 document.querySelector("[data-close]").onclick=closeModal;
}

const CAMP_STYLES=[
{id:"balanced",name:"Сбалансированный",icon:"⚖️",desc:"Ровный лагерь без перекоса.",bonus:"Все направления +1 к эффективности",penalty:"Нет выраженного пика",fatigue:4},
{id:"wrestling",name:"Борцовский",icon:"🤼",desc:"Тейкдауны, контроль и защита от борьбы.",bonus:"Борьба +4 • Грэпплинг +2",penalty:"Ударка -1 • усталость выше",fatigue:6},
{id:"striking",name:"Ударный",icon:"🥊",desc:"Работа на ногах, комбинации и урон.",bonus:"Ударка +4 • Скорость +2",penalty:"Борьба -1",fatigue:5},
{id:"grappling",name:"Грэпплинг",icon:"🥋",desc:"Партер, позиции и сабмишны.",bonus:"Грэпплинг +4 • Защита +2",penalty:"Кардио -1",fatigue:5},
{id:"conditioning",name:"Физический",icon:"🏃",desc:"Кардио, сила и восстановление.",bonus:"Кардио +4 • Сила +2",penalty:"Техника +0",fatigue:3},
{id:"peak",name:"Пиковый",icon:"🔥",desc:"Короткий жёсткий лагерь перед главным боем.",bonus:"Форма +8 • все боевые навыки +1",penalty:"Высокий риск усталости",fatigue:7}

function camp(){
let f=currentF();if(!f)return;if(f.injury){toast(`Боец недоступен: ${f.injury.name}, ${f.injury.weeks} нед.`);return}
if(!f.nextFight){document.getElementById("content").innerHTML=`<section class="panel"><div class="eyebrow">FIGHT CAMP</div><div class="title">Лагерь закрыт</div><div class="muted">Тренировки доступны только после назначения боя.</div><div class="actions one"><button class="primary" data-act="match">Найти бой</button></div></section>`;bind();return}
s.trainingPoints=s.trainingPoints??7;
let days=Math.max(0,f.nextFight.date-s.day),weeks=Math.max(3,Math.min(4,Math.ceil(days/7))),form=clamp(100-f.fatigue*.6+(f.morale-70)*.2);
let selected=f.campStyle||null,c=CAMP_STYLES.find(x=>x.id===selected)||null;
document.getElementById("content").innerHTML=`<section class="panel"><div class="eyebrow">FIGHT CAMP • ${f.nextFight.org}</div><div class="hero"><div class="avatar">${emoji(f.style)}</div><div class="hero-main"><h2>${f.name}</h2><div class="muted">vs ${f.nextFight.opponent.name} • бой через ${days} дней</div></div><div class="ovr">${form}%</div></div><div class="notice-strip">Выбери один стиль лагеря — дальше подготовка проходит автоматически по неделям. Не нужно вручную нажимать десятки тренировок.</div><div class="camp-summary"><div class="stat"><small>Форма</small><b>${form}%</b><div class="progress"><i style="width:${form}%"></i></div></div><div class="stat"><small>Лагерь</small><b>${weeks} недели</b><span class="muted">${c.name}</span></div></div></section>
<section class="panel"><div class="section-head"><h3>Профиль подготовки</h3><span>${c?"выбран":"нужно выбрать"}</span></div>${c?`<div class="camp-choice selected"><div class="fighter-top"><div class="avatar" style="width:42px;height:42px;font-size:21px">${c.icon}</div><div class="fighter-info"><div class="fighter-name">${c.name}</div><div class="fighter-sub">${c.desc}</div></div><b class="gold">✓</b></div><div class="tags"><span class="tag good">${c.bonus}</span><span class="tag bad">${c.penalty}</span></div></div><div class="actions one"><button data-change-camp>Изменить стиль лагеря</button></div>`:`<div class="notice-strip">Выбери один стиль один раз. После выбора все недели лагеря проходят автоматически вместе с календарём.</div><div class="list">${CAMP_STYLES.map(x=>`<div class="camp-choice" data-campstyle="${x.id}"><div class="fighter-top"><div class="avatar" style="width:42px;height:42px;font-size:21px">${x.icon}</div><div class="fighter-info"><div class="fighter-name">${x.name}</div><div class="fighter-sub">${x.desc}</div></div></div><div class="tags"><span class="tag good">${x.bonus}</span><span class="tag bad">${x.penalty}</span></div></div>`).join("")}</div>`}</section>
<section class="panel"><div class="section-head"><h3>Ход лагеря</h3><span>${weeks} недели</span></div>${Array.from({length:weeks},(_,i)=>`<div class="campweek ${i===0?"current":""}"><div class="row" style="padding:0;border:0"><b>Неделя ${i+1}</b><span class="muted">${i===0?"текущая":i===weeks-1?"пик":"подготовка"}</span></div><div class="dots">${Array.from({length:7},(_,d)=>`<span class="dot ${i===0&&d<Math.max(0,7-s.trainingPoints)?"train":""}"></span>`).join("")}</div></div>`).join("")}</section>
<section class="panel"><div class="grid4"><div class="stat"><small>Усталость</small><b>${f.fatigue}</b></div><div class="stat"><small>Мораль</small><b>${f.morale}</b></div><div class="stat"><small>Очки</small><b>${s.trainingPoints}/7</b></div><div class="stat"><small>Стиль</small><b>${c.name}</b></div></div><div class="actions one"><button class="primary" data-page="calendar">Открыть календарь</button>${days<=0?`<button class="primary" data-act="fight">⚔️ ДЕНЬ БОЯ</button>`:""}</div></section>`;
document.querySelectorAll("[data-campstyle]").forEach(b=>b.onclick=()=>{if((f.campWeek||1)>1){toast("Лагерь уже идёт — стиль фиксирован до боя");return}f.campStyle=b.dataset.campstyle;save();camp()});document.querySelector("[data-change-camp]")?.addEventListener("click",()=>{f.campStyle=null;save();camp()});bind()
}
function applyCampWeek(f){
let c=CAMP_STYLES.find(x=>x.id===(f.campStyle||"balanced"))||CAMP_STYLES[0];
if(c.id==="wrestling"){f.wrest=clamp(f.wrest+2);f.grap=clamp(f.grap+1);f.str=clamp(f.str-1)}
else if(c.id==="striking"){f.str=clamp(f.str+2);f.speed=clamp(f.speed+1);f.wrest=clamp(f.wrest-1)}
else if(c.id==="grappling"){f.grap=clamp(f.grap+2);f.def=clamp(f.def+1);f.cardio=clamp(f.cardio-1)}
else if(c.id==="conditioning"){f.cardio=clamp(f.cardio+2);f.power=clamp(f.power+1);f.fatigue=Math.max(0,f.fatigue-3)}
else if(c.id==="peak"){["str","wrest","grap","def","cardio"].forEach(k=>f[k]=clamp(f[k]+1));f.form=clamp(f.form+3)}
else {["str","wrest","grap","def","cardio"].forEach(k=>f[k]=clamp(f[k]+1))}
f.fatigue=clamp(f.fatigue+c.fatigue);f.form=clamp(100-f.fatigue*.6+(f.morale-70)*.2);s.trainingPoints=7;
}
function advanceWeek(){
let f=currentF();if(!f?.nextFight)return;
let remaining=f.nextFight.date-s.day;if(remaining<=0){toast("Бой уже наступил");return}
let step=Math.min(7,remaining);s.day+=step;applyCampWeek(f);
if(s.day>=f.nextFight.date){s.day=f.nextFight.date;notify("Лагерь завершён. Сегодня день боя.");}
else notify(`Прошла неделя лагеря. Осталось ${f.nextFight.date-s.day} дней.`);
save();render()
}

let f=currentF();if(!f?.nextFight){toast("Нет назначенного боя");return}
if(s.day<f.nextFight.date){toast("Дата боя ещё не наступила");return}
let n=f.nextFight,o=n.opponent;
document.getElementById("modal").classList.add("open");

 function setLive(x){let el=document.getElementById("live");if(el)el.textContent=x}
 function hit(att,def,attF){
   let zone=Math.random(),dmg=0,label="";
   let hand=(attF.handPower||attF.power||70),leg=(attF.legPower||attF.power||70);
   let accuracy=((attF.handSpeed||attF.speed||70)+(attF.movement||attF.speed||70))/220;
   if(zone<.45){dmg=rand(0,2)+Math.max(0,Math.round((hand-88)/55));def.head-=dmg;label="в голову"}
   else if(zone<.75){dmg=rand(0,2)+Math.max(0,Math.round((hand-90)/60));def.body-=dmg;label="в корпус"}
   else{dmg=rand(0,2)+Math.max(0,Math.round((leg-90)/60));def.legs-=dmg;label="по ногам"}
   dmg=Math.max(1,dmg);att.score+=dmg;att.roundScore+=dmg;att.sig++;
   att.hits=(att.hits||0)+1;
   return label;
 }
 function event(){
   let edge=(ovr(f)-ovr(o))/120+(f.form-o.form)/320+(a.stamina-b.stamina)/500;
   let t=Math.random();
   if(t<.62){
     if(Math.random()+edge*.35>.5){a.strikes=(a.strikes||0)+1;let label=hit(a,b,f);setLive(`${f.name} точно попадает ${label}`)}
     else{b.strikes=(b.strikes||0)+1;let label=hit(b,a,o);setLive(`${o.name} отвечает ${label}`)}
   }else if(t<.84){
     let tdEdge=((f.takedown||f.wrest)- (o.takedown||o.wrest))/180;
     if(Math.random()+tdEdge>.52){a.td++;a.control+=rand(2,5);a.roundScore+=rand(2,5);b.stamina=Math.max(0,b.stamina-rand(4,8));setLive(`${f.name} забирает тейкдаун и контроль`)}
     else if(Math.random()-tdEdge>.48){b.td++;b.control+=rand(2,5);b.roundScore+=rand(2,5);a.stamina=Math.max(0,a.stamina-rand(4,8));setLive(`${o.name} проводит тейкдаун`)}
     else setLive("Клинч у сетки — борьба за позицию")
   }else{
     let gEdge=((f.grap||70)-(o.grap||70))/180;
     if(Math.random()+gEdge>.72 && Math.min(a.stamina,b.stamina)<48 && Math.random()<.12){
       finishReason="Submission";finishRound=round;
       setLive(`${f.name} выходит на приём!`);
     }else setLive("Партер: работа за позицию и контроль");
   }
   a.stamina=Math.max(0,a.stamina-rand(0,1));b.stamina=Math.max(0,b.stamina-rand(0,1));
 }

function roundEnd(){
   let ar=a.roundScore,br=b.roundScore,winner=ar>br?"A":br>ar?"B":"X";let sa=ar===br?10:(ar>br?(ar-br>18?10:10):(10-(br-ar>18?2:1))),sb=ar===br?10:(br>ar?(br-ar>18?10:10):(10-(ar-br>18?2:1)));scorecards.push({a:sa,b:sb});
   a.rounds.push(winner);b.rounds.push(winner==="A"?"B":winner==="B"?"A":"X");

   a.stamina=Math.min(100,a.stamina+25);b.stamina=Math.min(100,b.stamina+25);

   setLive(winner==="X"?`Раунд ${round} — близкий, возможен split`:`Раунд ${round} — ${winner==="A"?f.name:o.name}`);

 }
 function finish(){
 if(fightFinished)return;
 fightFinished=true;f.fightResolved=true;running=false;cancelAnimationFrame(raf);

 let finishR=finishRound||round;
 let win=false,method="Decision",finishLabel="",scoreLines=[];
 const zoneKO=b.head<=2, zoneKO2=a.head<=2;

 // A declared submission always wins immediately for the fighter who initiated it.
 if(finishReason==="Submission"){
   win=true;method="Submission";finishLabel="SUBMISSION!";
 }else if(zoneKO||zoneKO2){
   win=zoneKO&&!zoneKO2;method="KO/TKO";finishLabel="KO!";
 }else{
   // Only a completed scheduled fight can reach the decision branch.
   const validRounds=scorecards.length;
   const totals=scorecards.slice(0,validRounds).reduce((t,r)=>({a:t.a+r.a,b:t.b+r.b}),{a:0,b:0});
   const aTotal=totals.a,bTotal=totals.b;
   const aWins=scorecards.filter(r=>r.a>r.b).length;
   const bWins=scorecards.filter(r=>r.b>r.a).length;

   if(aWins>bWins){win=true;method="Decision";finishLabel="WINNER — UNANIMOUS DECISION";}
   else if(bWins>aWins){win=false;method="Decision";finishLabel="WINNER — UNANIMOUS DECISION";}
   else{
     // Genuine split decision: two judges give it to one side, one to the other.
     method="Split Decision";
     const winnerA=aTotal>=bTotal;
     win=winnerA;
     finishLabel="WINNER — SPLIT DECISION";
   }
   scoreLines=scorecards.map(r=>`${r.a}-${r.b}`);
 }

 f.lastFightDay=s.day;
 f.history.unshift({day:s.day,date:dateLabel(s.day),result:win?"W":"L",opponent:o.name,method,round:finishR,org:n.org,event:n.event,venue:n.venue,card:n.card,status:"Завершён"});
 if(f.history.length>12)f.history.length=12;

 if(win){
   f.wins++;f.winStreak=(f.winStreak||0)+1;addWinMethod(f,method);if(f.title)f.titleDefenses=(f.titleDefenses||0)+1;
   f.morale=clamp(f.morale+8);f.rating=(f.rating||ovr(f))+4;s.money+=n.purse;

 }

 const completedOrg=n.org;
 if(f.agencyContract){
   f.agencyContract.fightsLeft=Math.max(0,(f.agencyContract.fightsLeft??f.agencyContract.length??1)-1);

 }
 f.fatigue=clamp(f.fatigue+35-Math.round(staffBonus("sportsScience")*5));applyPostFightCareer(f,win);
 updateTitlesAfterFight(f,o,win,n);f.nextFight=null;f.campWeek=0;f.campSchedule={};f.campStyle=null;
 s.trainingPoints=7;s.rep=clamp(s.rep+(win?2:0),0,100);

 o.history=o.history||[];o.history.unshift({day:s.day,date:dateLabel(s.day),result:win?"L":"W",opponent:f.name,method,round:finishR,org:n.org,event:n.event,venue:n.venue,card:n.card,status:"Завершён"});

 o.popularity=Math.max(1,Math.min(100,o.popularity+(win?-1:2)));

 logNews(`${f.name} ${win?"победил":"проиграл"} ${o.name} — ${method}${method==="Decision"||method==="Split Decision"?` (${scoreLines.join(", ")})`:""}.`);

 // Cinematic result overlay: appended directly to <body> so no parent

 // Hide every in-fight control while the result is being announced.

 function draw2DFight(){
 const c=document.getElementById("fightCanvas");if(!c)return;
 const ctx=c.getContext("2d"),W=c.width,H=c.height;
 ctx.clearRect(0,0,W,H);
 // arena background
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#171d26");bg.addColorStop(.58,"#0d1218");bg.addColorStop(1,"#06080b");
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // lights
 for(let i=0;i<7;i++){ctx.fillStyle="rgba(255,255,255,.035)";ctx.beginPath();ctx.ellipse(90+i*130,38,55,18,0,0,Math.PI*2);ctx.fill()}
 // cage
 ctx.fillStyle="#151b22";ctx.fillRect(36,105,W-72,H-155);
 ctx.strokeStyle="#69727c";ctx.lineWidth=5;ctx.strokeRect(36,105,W-72,H-155);
 ctx.strokeStyle="rgba(150,160,170,.18)";ctx.lineWidth=2;
 for(let x=50;x<W-45;x+=38){ctx.beginPath();ctx.moveTo(x,105);ctx.lineTo(x,H-50);ctx.stroke()}
 for(let y=122;y<H-50;y+=32){ctx.beginPath();ctx.moveTo(36,y);ctx.lineTo(W-36,y);ctx.stroke()}
 // canvas floor / logo
 ctx.fillStyle="#202830";ctx.fillRect(130,245,W-260,120);
 ctx.fillStyle="rgba(214,169,58,.10)";ctx.font="900 42px Arial";ctx.textAlign="center";ctx.fillText("MMA",W/2,315);
 // octagon-ish lines
 ctx.strokeStyle="#858d96";ctx.lineWidth=3;ctx.beginPath();
 ctx.moveTo(150,250);ctx.lineTo(230,210);ctx.lineTo(W-230,210);ctx.lineTo(W-150,250);ctx.lineTo(W-150,350);ctx.lineTo(W-230,390);ctx.lineTo(230,390);ctx.lineTo(150,350);ctx.closePath();ctx.stroke();

 const t=performance.now()/1000;
 const pulse=(Math.sin(t*7)+1)/2,exchange=pulse>.82;
 const distance=exchange?145:185,ax=W/2-distance,bx=W/2+distance,base=340;
 function drawFighter(x,flip,skin,shorts,glove,lean){
  ctx.save();ctx.translate(x,base);ctx.scale(flip?-1:1,1);
  // shadow
  ctx.fillStyle="rgba(0,0,0,.42)";ctx.beginPath();ctx.ellipse(0,66,48,9,0,0,Math.PI*2);ctx.fill();
  // back leg
  ctx.strokeStyle=skin;ctx.lineWidth=16;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-8,35);ctx.lineTo(-30,83);ctx.lineTo(-49,92);ctx.stroke();
  // front leg
  ctx.beginPath();ctx.moveTo(10,35);ctx.lineTo(25,82);ctx.lineTo(43,91);ctx.stroke();
  // shorts
  ctx.fillStyle=shorts;ctx.beginPath();ctx.roundRect(-25,18,50,34,7);ctx.fill();
  // torso
  ctx.fillStyle=skin;ctx.beginPath();ctx.roundRect(-23,-20,46,53,12);ctx.fill();
  // shoulder/arm rear
  ctx.strokeStyle=skin;ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(-18,-8);ctx.lineTo(-40,23);ctx.stroke();
  // jab arm
  const jabX=exchange?54:32,jabY=exchange?-25:5;
  ctx.strokeStyle=skin;ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(18,-9);ctx.lineTo(jabX,jabY);ctx.stroke();
  ctx.fillStyle=glove;ctx.beginPath();ctx.arc(jabX,jabY,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=glove;ctx.beginPath();ctx.arc(-40,23,10,0,Math.PI*2);ctx.fill();
  // neck/head
  ctx.fillStyle=skin;ctx.fillRect(-8,-31,16,13);ctx.beginPath();ctx.arc(0,-48,22,0,Math.PI*2);ctx.fill();
  // hair
  ctx.fillStyle="#171717";ctx.beginPath();ctx.arc(0,-55,21,Math.PI,Math.PI*2);ctx.fill();
  // face direction
  ctx.fillStyle="#111";ctx.beginPath();ctx.arc(9,-49,3,0,Math.PI*2);ctx.fill();
  // stamina
  ctx.fillStyle="#07090c";ctx.fillRect(-35,-82,70,7);ctx.fillStyle=lean>35?glove:"#a94343";ctx.fillRect(-35,-82,70*Math.max(0,lean)/100,7);
  ctx.restore();
 }
 drawFighter(ax,false,"#c89472","#263747","#d6a93a",a.stamina);
 drawFighter(bx,true,"#a9765c","#3c2428","#b85d5d",b.stamina);
 if(exchange){
   ctx.strokeStyle="#f2cf64";ctx.lineWidth=7;ctx.globalAlpha=.75;ctx.beginPath();ctx.moveTo(ax+60,base-25);ctx.lineTo(bx-60,base-25);ctx.stroke();ctx.globalAlpha=1;
   ctx.fillStyle="#fff";ctx.font="900 13px Arial";ctx.fillText("EXCHANGE",W/2,base-65);
 }
 // HUD
 ctx.fillStyle="#e9edf1";ctx.font="900 16px Arial";ctx.textAlign="center";
 ctx.fillText(`ROUND ${round}  •  ${Math.floor(Math.max(0,roundTime)/60)}:${String(Math.floor(Math.max(0,roundTime)%60)).padStart(2,"0")}`,W/2,78);
 ctx.textAlign="left";ctx.fillStyle="#d6a93a";ctx.fillText(f.name.toUpperCase(),48,40);
 ctx.textAlign="right";ctx.fillStyle="#d2d7dc";ctx.fillText(o.name.toUpperCase(),W-48,40);
}
function frame(now){
   if(!running)return;
   let dt=Math.min(.25,(now-last)/1000);last=now;let effectiveSpeed=speed;simTime+=dt*effectiveSpeed;roundTime-=dt*effectiveSpeed;
   let planBoost=currentPlan==="pressure"?1.12:currentPlan==="counter"?0.95:currentPlan==="wrestle"?1.05:currentPlan==="survive"?0.72:1;
   let ticks=Math.floor((simTime/4)*planBoost);
   if(ticks>0){simTime-=ticks*4;for(let i=0;i<Math.min(ticks,3);i++)event()}
   if(finishReason){finish();return}
   if(a.head<=0||b.head<=0){finish();return}
   if(roundTime<=0){
  roundTime=0;running=false;cancelAnimationFrame(raf);
  const tmEl=document.getElementById("tm");if(tmEl)tmEl.textContent="0:00";
  try{roundEnd()}catch(e){console.error("roundEnd error",e)}
  if(round<totalRounds){showNextRound()}else{finish()}return;
}
   let m=Math.floor(Math.max(0,roundTime)/60),sec=Math.floor(Math.max(0,roundTime)%60);
   document.getElementById("tm").textContent=`${m}:${String(sec).padStart(2,"0")}`;
   draw2DFight();
   [["ah",a.head],["ab",a.body],["al",a.legs],["bh",b.head],["bb",b.body],["bl",b.legs],["as",a.stamina],["bs",b.stamina]].forEach(([id,v])=>{let e=document.getElementById(id);if(e)e.textContent=Math.max(0,Math.round(v))});
   [["ahb",a.head],["abb",a.body],["alb",a.legs],["bhb",b.head],["bbb",b.body],["blb",b.legs],["asb",a.stamina],["bsb",b.stamina]].forEach(([id,v])=>{let e=document.getElementById(id);if(e)e.style.width=Math.max(0,v)+"%"});
   document.getElementById("stSig").textContent=`${a.sig} : ${b.sig}`;document.getElementById("stTd").textContent=`${a.td} : ${b.td}`;document.getElementById("stSub").textContent=`${a.sub} : ${b.sub}`;
   document.getElementById("stScore").textContent=`${a.score} : ${b.score}`;
   
raf=requestAnimationFrame(frame)
 }
 
document.getElementById("fightStats").onclick=()=>{
 const old=document.getElementById("fightStatsOverlay"); if(old)old.remove();
 const ov=document.createElement("div");ov.id="fightStatsOverlay";
 ov.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.82);padding:18px;overflow:auto";
 const rounds=a.rounds.map((x,i)=>{
   let sa=scorecards[i]?.a??10,sb=scorecards[i]?.b??10;
   return `<div class="row"><span>Раунд ${i+1}</span><b>${sa}-${sb}</b></div>`;
 }).join("");
 ov.innerHTML=`<div class="panel" style="max-width:620px;margin:20px auto">
  <div class="section-head"><h3>Статистика боя</h3><button id="closeFightStats">×</button></div>
  <div class="fight-stat-row"><div class="left">${f.name}</div><div class="mid">Бойцы</div><div class="right">${o.name}</div></div>
  <div class="fight-stat-row"><div class="left">${a.strikes||0}</div><div class="mid">Удары выброшено</div><div class="right">${b.strikes||0}</div></div>
  <div class="fight-stat-row"><div class="left">${a.hits||0}</div><div class="mid">Попадания</div><div class="right">${b.hits||0}</div></div>
  <div class="fight-stat-row"><div class="left">${a.strikes?Math.round((a.hits||0)/a.strikes*100):0}%</div><div class="mid">Точность</div><div class="right">${b.strikes?Math.round((b.hits||0)/b.strikes*100):0}%</div></div>
  <div class="fight-stat-row"><div class="left">${a.sig}</div><div class="mid">Значимые удары</div><div class="right">${b.sig}</div></div>
  <div class="fight-stat-row"><div class="left">${a.td}</div><div class="mid">Тейкдауны</div><div class="right">${b.td}</div></div>
  <div class="fight-stat-row"><div class="left">${a.sub}</div><div class="mid">Попытки сабмишена</div><div class="right">${b.sub}</div></div>
  <div class="fight-stat-row"><div class="left">${Math.round(a.control||0)}%</div><div class="mid">Контроль</div><div class="right">${Math.round(b.control||0)}%</div></div>
  <h4 style="margin-top:15px">Счёт по раундам</h4>
  ${a.rounds.map((x,i)=>`<div class="fight-stat-row"><div class="left">${scorecards[i]?.a??10}</div><div class="mid">Раунд ${i+1}</div><div class="right">${scorecards[i]?.b??10}</div></div>`).join("")||'<div class="muted">Раунды ещё не завершены.</div>'}
  <div class="sheet-actions"><button id="closeFightStats2" class="primary">Вернуться к бою</button></div>
 </div>`;document.body.appendChild(ov);
 document.getElementById("closeFightStats").onclick=()=>ov.remove();
 document.getElementById("closeFightStats2").onclick=()=>ov.remove();
};

const fightControls=document.querySelector(".fight-controls");
const nb=document.getElementById("nextRoundBtn"),pb=document.getElementById("changePlanBtn");
pb.onclick=async()=>{currentPlan=await chooseFightPlan();roundPlans[round-1]=currentPlan;toast("План: "+fightPlanLabel(currentPlan))};
nb.onclick=()=>startNextRound();
document.querySelectorAll("[data-sp]").forEach(x=>x.onclick=()=>{speed=+x.dataset.sp;document.querySelectorAll("[data-sp]").forEach(y=>y.classList.remove("primary"));x.classList.add("primary");document.getElementById("speedText").textContent=`${speed===1?"Обычное время":speed===30?"Ускоренное время":"Молниеносное время"} • 1 раунд ≈ ${Math.max(1,Math.round(300/speed))} сек`});
 document.getElementById("stopFight").onclick=()=>{
  running=false;cancelAnimationFrame(raf);
  save();
  closeModal();
  page("home");
};
 raf=requestAnimationFrame(frame)
}

function logNews(text,type="NEWS"){s.news.unshift({title:type==="CARD"?"КАРД":type==="RANKINGS"?"РЕЙТИНГИ":type==="DWCS"?"DWCS":type==="TRANSFER"?"ПЕРЕХОДЫ":"НОВОСТИ",text,day:s.day});s.news=s.news.slice(0,30)}
function notify(text){logNews(text);toast(text)}
function updateManagerMetrics(win){
 s.managerFights=(s.managerFights||0)+1;
 if(win)s.managerWins=(s.managerWins||0)+1;else s.managerLosses=(s.managerLosses||0)+1;
 s.managerRecord=s.managerRecord||{wins:0,losses:0,draws:0};if(win)s.managerRecord.wins++;else s.managerRecord.losses++;
 let wr=s.managerFights?s.managerWins/s.managerFights:0;
 s.managerRating=clamp(Math.round(45+wr*45+(s.rep||0)*.1+(s.fighters.length||0)*.8),1,100);
 s.managerPopularity=Math.max(1,Math.min(100,Math.round((s.managerPopularity||8)+(win?1.4:.2)+Math.max(0,(s.rep||0)-20)*.01)));
}
function rest(){let f=currentF();if(f?.nextFight){toast("Во время лагеря отдых входит в выбранный план");return}advanceWorld(7);f.fatigue=Math.max(0,f.fatigue-15);f.form=clamp(f.form+5);f.morale=clamp(f.morale+3);save();render()}
function bind(){document.querySelectorAll("[data-profile-own]").forEach(b=>b.onclick=()=>{s.selected=+b.dataset.profileOwn;save();profile(s.fighters[s.selected],"roster")});
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>page(b.dataset.page));document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>b.dataset.act==="market"?market():null);document.querySelectorAll("[data-fighter-match]").forEach(b=>b.onclick=e=>{e.stopPropagation();s.selected=+b.dataset.fighterMatch;save();matchmake()});document.querySelectorAll("[data-campfighter]").forEach(b=>b.onclick=()=>{let f=findById(b.dataset.campfighter);if(!f)return;s.selected=s.fighters.findIndex(x=>x.id===f.id);save();camp()});document.querySelectorAll("[data-select]").forEach(b=>b.onclick=()=>{s.selected=+b.dataset.select;save();rosterProfile(s.selected)});document.querySelectorAll("[data-open-profile]").forEach(b=>b.onclick=e=>{e.stopPropagation();s.selected=+b.dataset.openProfile;save();rosterProfile(s.selected)});document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act))}
function act(a){if(a==="market")market();if(a==="create")createFighter();if(a==="match")matchmake();if(a==="fight")fight();if(a==="camp")camp();if(a==="fight")fight();if(a==="rest")rest();if(a==="profileOpp"){let f=currentF();if(f?.nextFight)profile(f.nextFight.opponent,"home")}}
function closeModal(){document.getElementById("modal").classList.remove("open");document.getElementById("sheet").innerHTML=""}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
window.addEventListener("pagehide",save);window.addEventListener("beforeunload",save);
render();
</script>
