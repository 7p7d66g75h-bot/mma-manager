name: Apply V36 championship system
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch championship system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('MMA_MANAGER_V35','MMA_MANAGER_V36')
          s=s.replace('MMA Manager V35 • Road to Champion','MMA Manager V36 • Road to Champion')
          css='''\n<style id="championship-v36-css">\n.champ-v36{margin:0 0 10px;background:linear-gradient(145deg,#211b0f,#0d1014);border:1px solid #80672a;border-radius:10px;padding:12px}.champ-v36-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.champ-v36-title{font-size:16px;font-weight:950}.champ-v36-sub{font-size:10px;color:#8e98a4}.champ-v36-grid{display:grid;grid-template-columns:1fr;gap:7px}.champ-v36-card{background:#101419;border:1px solid #37312a;border-radius:8px;padding:9px}.champ-v36-org{font-size:9px;color:#9da6af;letter-spacing:1px;font-weight:900}.champ-v36-name{font-size:14px;font-weight:950;margin-top:3px}.champ-v36-meta{font-size:10px;color:#8e98a4;margin-top:2px}.champ-v36-belt{float:right;font-size:21px}.champ-v36-number{color:#d5ae42;font-weight:950;margin-right:5px}.champ-v36-contender{display:inline-block;margin-top:5px;font-size:9px;color:#b9c0c8;background:#20262e;border:1px solid #303740;border-radius:4px;padding:3px 5px}\n</style>\n'''
          if 'id="championship-v36-css"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          js='''\n<script id="championship-v36-js">\n(function(){\n const esc=v=>String(v??'').replace(/[&<>\\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',"'":'&#39;'}[m]));\n function activeFighters(){ try{return typeof allPool==='function'?allPool().filter(f=>f&&!f.retired):[]}catch(e){return []} }\n function weightOf(f){ return f.weightClass||f.weight||f.division||f.category||'Open'; }\n function orgOf(f){ return f.org||f.organization||'Free Agent'; }\n function ratingOf(f){ try{return Number(f.rating||f.ovr||f.overall||((typeof ovr==='function')?ovr(f):0))||0}catch(e){return 0} }\n function champions(){\n   const fs=activeFighters(), groups=new Map();\n   for(const f of fs){ const org=orgOf(f); if(!org||org==='Free Agent')continue; const key=org+'|'+weightOf(f); const old=groups.get(key); if(!old||ratingOf(f)>ratingOf(old))groups.set(key,f); }\n   return [...groups.entries()].map(([key,f])=>({key,org:orgOf(f),weight:weightOf(f),f})).sort((a,b)=>a.org.localeCompare(b.org)||String(a.weight).localeCompare(String(b.weight)));\n }\n function inject(){\n   try{\n     const root=document.querySelector('.content'); if(!root)return;\n     const txt=(root.innerText||'').toLowerCase();\n     const isRank=txt.includes('рейтин') || root.querySelector('.rankline');\n     if(!isRank)return;\n     let box=document.getElementById('championship-v36-box');\n     if(!box){box=document.createElement('div');box.id='championship-v36-box';root.prepend(box)}\n     const cs=champions();\n     const top=cs.slice(0,12);\n     box.className='champ-v36';\n     box.innerHTML='<div class="champ-v36-head"><div><div class="champ-v36-title">🏆 ЧЕМПИОНЫ</div><div class="champ-v36-sub">Действующие чемпионы по организациям и весовым</div></div><div class="champ-v36-belt">🏆</div></div><div class="champ-v36-grid">'+top.map((x,i)=>'<div class="champ-v36-card"><span class="champ-v36-number">#'+(i+1)+'</span><span class="champ-v36-org">'+esc(x.org)+'</span><div class="champ-v36-name">🏆 '+esc(x.f.name||x.f.fullName||'Unknown')+'</div><div class="champ-v36-meta">'+esc(x.weight)+' • '+ratingOf(x.f)+'</div><span class="champ-v36-contender">№1 претендент: определяется рейтингом</span></div>').join('')+'</div>';\n   }catch(e){}\n }\n function hook(){\n   if(typeof window.render==='function'&&!window.__champV36){\n     const old=window.render; window.render=function(){const r=old.apply(this,arguments);setTimeout(inject,0);return r}; window.__champV36=true;\n   }\n   inject();\n }\n setTimeout(hook,250); setTimeout(hook,1000);\n})();\n</script>\n'''
          if 'id="championship-v36-js"' not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'V36: championship belts and champions panel'
          git push
