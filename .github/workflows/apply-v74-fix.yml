name: Apply V74 bugfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script id="MMA_MANAGER_V74_BUGFIX" src="scripts/v74_bugfix.js?v=74"></script>\n'
          if 'id="MMA_MANAGER_V74_BUGFIX"' not in s:
              s=s.replace('</body>',tag+'</body>',1)
          s=s.replace('const BUILD="MMA_MANAGER_V73_BUGFIX"','const BUILD="MMA_MANAGER_V74_BUGFIX"',1)
          s=s.replace('scripts/v73_bugfix.js?v=73','scripts/v73_bugfix.js?v=74')
          p.write_text(s,encoding='utf-8')
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "V74: fix round gate and refusal suspension"
          git push
