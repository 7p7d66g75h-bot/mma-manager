name: Apply V1 fight contract
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'V1 fight contract applied')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebase on latest main
        run: |
          git pull --rebase origin main
      - name: Patch and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path('scripts/fight_contract_v1.js').read_text(encoding='utf-8')
          assert "MMA_MANAGER_V1_FIGHT_CONTRACT" in script
          assert "contractTerms" in script
          assert "data-contract-sign" in script
          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')
          tag='<script src="scripts/fight_contract_v1.js?v=1"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('No body closing tag')
              s=s.replace('</body>', tag+'\n</body>',1)
          idx.write_text(s,encoding='utf-8')
          print('V1 CONTRACT PATCH VALIDATION OK')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'V1 fight contract applied'
          git push origin HEAD
