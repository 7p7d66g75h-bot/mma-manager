name: V38 rankings UI cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch rankings UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'MMA_MANAGER_V38_UI' in s:
              raise SystemExit(0)
          patch=r'''<style id="mma-v38-ui">
          .mma-v38-hidden{display:none!important}
          .mma-v38-champion{border-color:#d5ae42!important;box-shadow:0 0 0 1px #d5ae4233!important}
          .mma-v38-champion-badge{display:inline-flex;align-items:center;gap:4px;margin-left:6px;color:#d5ae42;font-weight:950;font-size:10px;letter-spacing:.7px}
          </style>
          <script id="mma-v38-ui-script">
          (function(){
            'use strict';
            const BUILD='MMA_MANAGER_V38_UI';
            document.documentElement.dataset.build=BUILD;
            function cleanChampionPanels(){
              const els=[...document.querySelectorAll('body *')];
              els.forEach(el=>{
                if(el.children.length>8) return;
                const t=(el.textContent||'').replace(/\\s+/g,' ').trim();
                if(!t) return;
                if(/^🏆?\\s*ЧЕМПИОНЫ\\b/i.test(t) || /^ЧЕМПИОНЫ\\b/i.test(t)){
                  let target=el;
                  for(let i=0;i<3&&target.parentElement;i++){
                    const p=target.parentElement;
                    if(p.classList.contains('panel')||p.classList.contains('belt')){target=p;break;}
                    target=p;
                  }
                  if(target && target!==document.body) target.classList.add('mma-v38-hidden');
                }
              });
              document.querySelectorAll('body *').forEach(el=>{
                if(el.children.length===0){
                  const t=(el.textContent||'').trim();
                  if(/^Выбери организацию и весовую категорию/i.test(t) || /^Действующие чемпионы по организациям/i.test(t)){
                    const p=el.closest('.panel,.belt'); if(p) p.classList.add('mma-v38-hidden'); else el.classList.add('mma-v38-hidden');
                  }
                }
              });
            }
            function separateChampionFromNumberOne(){
              document.querySelectorAll('.rankline').forEach(row=>{
                const txt=(row.textContent||'').toUpperCase();
                if(/CHAMPION|ЧЕМПИОН/.test(txt)){
                  row.classList.add('mma-v38-champion');
                  const n=row.querySelector('.ranknum');
                  if(n) n.textContent='🏆';
                  if(!row.querySelector('.mma-v38-champion-badge')){
                    const name=row.querySelector('.fighter-name,.fighter-info,.op-name,.op-info');
                    if(name){const b=document.createElement('span');b.className='mma-v38-champion-badge';b.textContent='CHAMPION';name.appendChild(b)}
                  }
                }
              });
              const containers=new Set();
              document.querySelectorAll('.rankline').forEach(r=>containers.add(r.parentElement));
              containers.forEach(c=>{
                let n=1;
                [...c.children].filter(x=>x.classList&&x.classList.contains('rankline')).forEach(r=>{
                  const txt=(r.textContent||'').toUpperCase();
                  const isChamp=/CHAMPION|ЧЕМПИОН/.test(txt);
                  const num=r.querySelector('.ranknum');
                  if(!num) return;
                  if(isChamp) num.textContent='🏆';
                  else num.textContent=String(n++);
                });
              });
            }
            function run(){cleanChampionPanels();separateChampionFromNumberOne();}
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
            new MutationObserver(run).observe(document.body,{subtree:true,childList:true});
            try{localStorage.setItem('mma_manager_build',BUILD)}catch(e){}
          })();
          </script>'''
          s=s.replace('</body>',patch+'\n</body>')
          s=s.replace('MMA_MANAGER_V37','MMA_MANAGER_V38')
          s=s.replace('MMA_MANAGER_V36','MMA_MANAGER_V38')
          s=s.replace('MMA_MANAGER_V35','MMA_MANAGER_V38')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "V38: clean champion panels and separate champion from #1 [skip ci]"
          git push
