name: Apply V36 championship system
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch championship system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          Path('backups').mkdir(exist_ok=True)
          Path('backups/index-v35-before-championship.html').write_text(s,encoding='utf-8')
          s=s.replace('const BUILD="MMA_MANAGER_V35"','const BUILD="MMA_MANAGER_V36"',1)
          s=s.replace('MMA Manager V35 • Road to Champion','MMA Manager V36 • Road to Champion',1)
          css='''\n.championship-card{background:linear-gradient(145deg,#201a0d,#0f1115);border:1px solid #80672a;border-radius:10px;padding:12px;margin-top:8px}.championship-card .belt-mini{font-size:30px;float:left;margin-right:10px}.champion-name{font-size:16px;font-weight:950}.champion-meta{font-size:10px;color:#9da6af;margin-top:3px}.title-tag{display:inline-block;margin-top:5px;padding:3px 6px;border:1px solid #80672a;border-radius:5px;color:#d5ae42;font-size:9px;font-weight:900}.title-fight-tag{display:inline-block;padding:4px 7px;border-radius:5px;background:#322915;border:1px solid #80672a;color:#e1bd52;font-size:10px;font-weight:950}\n'''
          s=s.replace('</style>',css+'</style>',1)
          old=re.search(r'const OFFICIAL_PROMOTIONS=\[.*?function injuryRisk\(f\)\{',s,re.S)
          if not old: raise SystemExit('championship block marker not found')
          new='''const OFFICIAL_PROMOTIONS=ORGS.filter(o=>o.name!=="DWCS").map(o=>o.name);\nconst TITLE_NAMES={};\nfunction promotionForFighter(f){return f?.org||null}\nfunction titleFor(org,w){return `${org} ${w} Champion`}\nfunction ensureTitleState(){s.titles=s.titles||{};for(const org of OFFICIAL_PROMOTIONS){s.titles[org]=s.titles[org]||{};for(const w of WEIGHTS){const id=s.titles[org][w],holder=id?findById(id):null;if(holder&&(holder.retired||holder.org!==org||holder.weight!==w)){if(holder.title?.org===org&&holder.title?.weight===w)holder.title=null;delete s.titles[org][w];}}}}\nfunction titleHolder(org,w){ensureTitleState();return s.titles?.[org]?.[w]?findById(s.titles[org][w]):null}\nfunction setTitle(org,w,f,reason=""){if(!f)return;ensureTitleState();const old=titleHolder(org,w);if(old&&old.id!==f.id){old.formerChampion={org,defenses:old.titleDefenses||0,reason};old.title=null;}s.titles[org][w]=f.id;f.title={org,weight:w};f.titleDefenses=f.titleDefenses||0;f.careerStage="Champion";}\nfunction clearTitle(org,w){ensureTitleState();const old=titleHolder(org,w);if(old&&old.title?.org===org&&old.title?.weight===w)old.title=null;if(s.titles?.[org])delete s.titles[org][w];}\nfunction orgRank(f,org){if(!f)return 999;const arr=s.rankingsByOrg?.[org]?.[f.weight]||[];const x=arr.find(r=>r.id===f.id);return x?.rank||999;}\nfunction isTitleFightPair(f,o,org){if(!f||!o||!org)return false;const holder=titleHolder(org,f.weight);if(holder&&(holder.id===f.id||holder.id===o.id))return true;if(!holder){const rf=orgRank(f,org),ro=orgRank(o,org);return rf<=2&&ro<=2;}return false;}\nfunction championshipLabel(f){return f?.title?`🏆 ЧЕМПИОН • ${f.title.org}`:"";}\nfunction injuryRisk(f){'''
          s=s[:old.start()]+new+s[old.end():]
          s=re.sub(r'function updateTitlesAfterFight\(f,o,win,n\)\{.*?\n\}', '''function updateTitlesAfterFight(f,o,win,n){\n const org=n.org,w=f.weight;ensureTitleState();const holder=titleHolder(org,w);const titleFight=!!n.titleFight||(holder&&(holder.id===f.id||holder.id===o.id));if(!titleFight)return;\n if(holder&&holder.id===f.id){if(win){f.titleDefenses=(f.titleDefenses||0)+1;f.title={org,weight:w};f.careerStage="Champion";logNews(`${f.name} защитил титул ${titleFor(org,w)}. Защит: ${f.titleDefenses}.`,`TITLE`);}else{clearTitle(org,w);o.titleDefenses=0;setTitle(org,w,o,"Победа над чемпионом");logNews(`${o.name} стал новым чемпионом ${org} в весе ${w}.`,`TITLE`);}return;}\n if(holder&&holder.id===o.id){if(win){clearTitle(org,w);f.titleDefenses=0;setTitle(org,w,f,"Победа над чемпионом");logNews(`${f.name} завоевал титул ${titleFor(org,w)}.`,`TITLE`);}return;}\n const winner=win?f:o;clearTitle(org,w);winner.titleDefenses=0;setTitle(org,w,winner,"Вакантный титул");logNews(`${winner.name} завоевал вакантный титул ${titleFor(org,w)}.`,`TITLE`);\n}\n''',s,count=1,flags=re.S)
          needle='rows.push({opponent:o,org:org.name,rounds:'
          if needle not in s: raise SystemExit('matchmaking row marker not found')
          s=s.replace(needle,'rows.push({titleFight:isTitleFightPair(f,o,org.name),opponent:o,org:org.name,rounds:',1)
          s=s.replace('nextFight={...n,opponent:o}','nextFight={...n,titleFight:!!n.titleFight,opponent:o}',1)
          s=s.replace('type==="TRANSFER"?"ПЕРЕХОДЫ":"НОВОСТИ"','type==="TRANSFER"?"ПЕРЕХОДЫ":type==="TITLE"?"ТИТУЛЫ":"НОВОСТИ"',1)
          champion_expr='''function championCard(org,w){const h=titleHolder(org,w);if(!h)return `<div class="championship-card"><span class="belt-mini">🏆</span><div class="champion-name">ВАКАНТНО</div><div class="champion-meta">${org} • ${w} • титул ждёт нового обладателя</div></div>`;return `<div class="championship-card"><span class="belt-mini">🏆</span><div class="champion-name">${h.name}</div><div class="champion-meta">${org} • ${w} • ${rec(h)}</div><span class="title-tag">ЧЕМПИОН • ${h.titleDefenses||0} защит</span></div>`;}\n'''
          if 'function championCard(org,w)' not in s:s=s.replace('function rankings(){',champion_expr+'function rankings(){',1)
          old_div='''html+=`<section class="panel"><div class="title">${org.name} — дивизионы</div>`;\n   for(let w of WEIGHTS){let arr=s.rankingsByOrg?.[org.name]?.[w]||[];html+=`<div style="margin-top:12px"><div class="section-head"><h3>${w}</h3><span>TOP 15</span></div>${rankingRows(arr,15)||`<div class="muted">Пока нет рейтинга.</div>`}</div>`}'''
          new_div='''html+=`<section class="panel"><div class="title">${org.name} — дивизионы</div>`;\n   for(let w of WEIGHTS){let arr=s.rankingsByOrg?.[org.name]?.[w]||[];html+=`<div style="margin-top:12px"><div class="section-head"><h3>${w}</h3><span>ЧЕМПИОН + TOP 15</span></div>${championCard(org.name,w)}${rankingRows(arr.filter(r=>r.id!==s.titles?.[org.name]?.[w]),15)||`<div class="muted">Пока нет рейтинга.</div>`}</div>`}'''
          if old_div in s:s=s.replace(old_div,new_div,1)
          s=s.replace('let rs=recordStats(f),org=f.org||"Свободный агент",champ=f.title,former=f.formerChampion||null,defenses=f.titleDefenses||0;','let rs=recordStats(f),org=f.org||"Свободный агент",champ=f.title||null,former=f.formerChampion||null,defenses=f.titleDefenses||0; if(org!=="Свободный агент"){const th=titleHolder(org,f.weight);if(th?.id===f.id)champ={org,weight:f.weight};}',1)
          s=s.replace('if(typeof ensureTitleState==="function")if(typeof ensureTitleState==="function")ensureTitleState();updateRankings();','if(typeof ensureTitleState==="function")ensureTitleState();updateRankings();',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          part=s.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/mma-manager-script.js').write_text(part,encoding='utf-8')
          PY
          node --check /tmp/mma-manager-script.js
      - name: Commit patch and backup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html backups/index-v35-before-championship.html
          git commit -m 'V36: complete championship and belt system' || true
          git push --force origin HEAD:main
