name: Apply V64 organization system
on:
  push:
    branches: [v64-organization-rebuild, main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'V64 organization patch applied')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V64
        run: python3 scripts/fix_v64.py
      - name: Validate V64
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'scripts/organization_v64.js' in s
          assert 'MMA_MANAGER_V64_ORGANIZATION' in Path('scripts/organization_v64.js').read_text(encoding='utf-8')
          assert 'function v64Matchmake' in Path('scripts/organization_v64.js').read_text(encoding='utf-8')
          print('V64 validation OK')
          PY
      - name: Commit V64
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'V64 organization patch applied'
          git push origin HEAD
