name: Fix JS runtime + league discipline
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V50 patch
        run: python3 scripts/patch_v50.py
      - name: Apply V51 contract history patch
        run: python3 scripts/patch_v51.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V51: contract history, 180-day discipline and refusal confirmation [skip ci]'
          git push
