name: Fix JS runtime + league discipline
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V50 + V51 + V52 + V53 patches and commit safely
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/patch_v50.py
            python3 scripts/patch_v51.py
            python3 scripts/patch_v52.py
            python3 scripts/patch_v53.py
            git add index.html
            if git diff --cached --quiet; then
              echo 'No patch changes required.'
              exit 0
            fi
            git commit -m 'V53: preserve mechanics and restore contract/camp controls [skip ci]'
            if git push origin HEAD:main; then
              echo "Patch committed on attempt $attempt"
              exit 0
            fi
            echo "Concurrent workflow won attempt $attempt; retrying..."
            git reset --hard origin/main
            sleep 2
          done
          echo 'Could not push V53 patch after retries.'
          exit 1