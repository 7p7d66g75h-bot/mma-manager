name: Fix JS runtime + championships
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime and championship system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='if(s.worldPrepared&&Array.isArray(s.world)&&s.world.length>=4000){rebalanceUFC();return;}'
          new='if(s.worldPrepared&&Array.isArray(s.world)&&s.world.length>=4000){rebalanceUFC();ensureTitleState();simulateVacantTitles();updateRankings();save();return;}'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V37: initialize championships in existing careers [skip ci]'
          git push
