name: Verify V70 organization runtime
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate organization runtime
        run: |
          node --check scripts/organization_v64.js
          python3 - <<'PY'
          from pathlib import Path
          org=Path('scripts/organization_v64.js').read_text(encoding='utf-8')
          assert 'MMA_MANAGER_ORG_RUNTIME_V70' in org
          assert 'function generate(f)' in org
          assert 'function openFlow(f)' in org
          assert 'data-fighter-match' in org
          assert 'refusalOfferBatchSize' in org
          print('V70 organization runtime validation OK')
          PY