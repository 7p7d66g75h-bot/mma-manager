name: Verify V68 live organization script
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'V68 live organization script applied')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync main before patch
        run: git pull --rebase origin main
      - name: Patch and verify live script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          org=Path('scripts/organization_v64.js').read_text(encoding='utf-8')
          assert 'return Math.floor(90+Math.random()*61)' in org
          assert 'f.refusalOfferBatchSize=offers.length' in org
          assert 'const days=freePenalty(t)' in org
          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')
          s=re.sub(r'scripts/organization_v64\.js(?:\?[^"\']*)?', 'scripts/organization_v64.js?v=68', s)
          s=s.replace('MMA_MANAGER_V67_REFUSAL_RUNTIME','MMA_MANAGER_V68_REFUSAL_RUNTIME')
          s=s.replace('MMA_MANAGER_V67_LIVE_REFUSAL_SYSTEM','MMA_MANAGER_V68_REFUSAL_RUNTIME')
          if 'scripts/organization_v64.js?v=68' not in s:
              raise SystemExit('organization script tag was not patched')
          idx.write_text(s,encoding='utf-8')
          print('LIVE V68 VALIDATION OK')
          PY
      - name: Commit live patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'V68 live organization script applied'
          git push origin HEAD
