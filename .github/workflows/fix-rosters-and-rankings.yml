name: Fix UFC roster size and rankings counter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const BUILD="MMA_MANAGER_V32"','const BUILD="MMA_MANAGER_V33"')
          s=s.replace('<title>MMA Manager V32 • Road to Champion</title>','<title>MMA Manager V33 • Road to Champion</title>')
          old='''  "UFC":320,"PFL":300,"ONE Championship":360,"RIZIN":340,"ACA":340,\n  "LFA":360,"KSW":340,"Cage Warriors":300,"Ares FC":280,"BRAVE CF":260'''
          new='''  "UFC":650,"PFL":350,"ONE Championship":400,"RIZIN":380,"ACA":360,\n  "LFA":420,"KSW":380,"Cage Warriors":350,"Ares FC":330,"BRAVE CF":380'''
          if old not in s: raise SystemExit('quota block not found')
          s=s.replace(old,new,1)
          s=s.replace('if(s.worldPrepared&&Array.isArray(s.world)&&s.world.length>=3200)return;','if(s.worldPrepared&&Array.isArray(s.world)&&s.world.length>=4000){rebalanceUFC();return;}')
          marker='''function ensureWorld(){\n'''
          insert='''function rebalanceUFC(){\n const active=s.world.filter(f=>!f.retired);\n let ufc=active.filter(f=>f.org==="UFC");\n if(ufc.length>=600)return;\n const need=Math.min(650-ufc.length,active.length-ufc.length);\n const candidates=active.filter(f=>f.org!=="UFC"&&!f.injury&&!f.nextFight&&topLeagueEligible(f,"UFC"))\n   .sort((a,b)=>((b.rating||ovr(b))-(a.rating||ovr(a)))+(Math.random()-.5)*4);\n for(let i=0;i<Math.min(need,candidates.length);i++){candidates[i].org="UFC";candidates[i].orgLevel=ORGS.find(o=>o.name==="UFC")?.level||10;}\n updateRankings();\n save();\n}\nfunction activeWorldCount(){\n const seen=new Set();\n for(const f of allPool()) if(f&&!f.retired&&f.id!=null) seen.add(f.id);\n return seen.size;\n}\n\n'''
          if marker not in s: raise SystemExit('ensureWorld marker not found')
          s=s.replace(marker,insert+marker,1)
          s=s.replace(''' s.worldPrepared=true;\n save();\n}''',''' rebalanceUFC();\n s.worldPrepared=true;\n save();\n}''',1)
          oldcounter='''<div class="rank-meta">БОЙЦОВ В МИРЕ <b>${allPool().filter(f=>!f.retired).length.toLocaleString("ru-RU")}</b></div>'''
          newcounter='''<div class="rank-meta">АКТИВНЫЕ БОЙЦЫ <b>${activeWorldCount().toLocaleString("ru-RU")}</b></div>'''
          if oldcounter not in s: raise SystemExit('counter block not found')
          s=s.replace(oldcounter,newcounter,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Set UFC roster to 600-700 and show active fighter count"
          git push