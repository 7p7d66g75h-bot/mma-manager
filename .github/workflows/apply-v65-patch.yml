name: Apply V65 matchmaking patch

on:
  push:
    paths:
      - 'scripts/organization_v65_patch.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply minimal V65 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/organization_v64.js')
          text = p.read_text(encoding='utf-8')
          text, n1 = re.subn(r"return 100,120", "return 90,150", text, count=1)
          if n1 != 1:
              raise SystemExit('Refusal penalty marker not found')
          old = "const offers=generateOffers(f);"
          new = "const existing=(f.organizationOffers||[]).filter(x=>num(x.expires,0)>=day()&&!x.resolved);const offers=existing.length?existing:generateOffers(f);"
          if old not in text:
              raise SystemExit('Matchmaking generation marker not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit V65
        run: |
          git config user.name '7p7d66g75h-bot'
          git config user.email '7p7d66g75h-bot@users.noreply.github.com'
          git add scripts/organization_v64.js
          git commit -m 'V65: fix refusal penalty and preserve offers on exit' || exit 0
          git push
