name: Apply V59 stable fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Apply V59 stable fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix_v59.py
      - name: Validate HTML/JS markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'MMA_MANAGER_V59_STABLE_FIX' in s
          assert 'MMA_MANAGER_V53_PRESERVE_MECHANICS' not in s
          assert 'function v52HistoryUI(){try{' in s
          assert '[data-change-camp]' in s
          assert '[data-campstyle]' in s
          print('V59 validation OK')
          PY
      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply V59 stable fix'
          git push
