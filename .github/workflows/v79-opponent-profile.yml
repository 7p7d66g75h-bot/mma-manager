name: V79 opponent profile fix
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="scripts/v79_opponent_profile_fix.js?v=79"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no </body>')
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          print('V79 index patched')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'V79: connect opponent profile fix'
          git push
