name: V45 menu speed
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch speed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          s=s.replace('const BUILD="MMA_MANAGER_V44";','const BUILD="MMA_MANAGER_V45";',1)
          s=s.replace('<title>MMA Manager V44 • Road to Champion</title>','<title>MMA Manager V45 • Road to Champion</title>',1)
          old='function getPos(f){updateRankings();let a=s.rankings[f.weight]||[];let x=a.find(z=>z.id===f.id);return x?x.rank:"—"}'
          new='function getPos(f){let a=s.rankings[f.weight]||[];let x=a.find(z=>z.id===f.id);return x?x.rank:"—"}'
          if old in s:s=s.replace(old,new,1)
          old='if(!s._normalized){ normalizeSave(); s._normalized=true; }'
          new='if(!s._normalized){ s._normalized=true; setTimeout(()=>{try{normalizeSave();save();}catch(e){console.error("Deferred normalization failed",e)}},0); }'
          if old in s:s=s.replace(old,new,1)
          marker='</style><style id="fight-controls-v23">'
          loader_css='</style><style id="v45-speed-ui">#speedLoader{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:2147483646;display:none;align-items:center;gap:7px;padding:7px 10px;border:1px solid #343b45;border-radius:9px;background:rgba(12,16,21,.94);box-shadow:0 8px 25px #000;color:#cbd1d8;font-size:10px;font-weight:800;backdrop-filter:blur(8px)}#speedLoader.show{display:flex}#speedLoader i{width:12px;height:12px;border:2px solid #3a414b;border-top-color:#d5ae42;border-radius:50%;animation:v45spin .7s linear infinite}@keyframes v45spin{to{transform:rotate(360deg)}}.speed-placeholder{padding:22px;text-align:center;color:#8e98a4;font-size:12px}</style><style id="fight-controls-v23">'
          if marker in s:s=s.replace(marker,loader_css,1)
          old='<div id="toast" class="toast"></div>'
          new='<div id="toast" class="toast"></div><div id="speedLoader"><i></i><span>Подготавливаем бой…</span></div>'
          if old in s:s=s.replace(old,new,1)
          if 'function _matchmakeHeavy()' not in s and 'function matchmake(){' in s:
            s=s.replace('function matchmake(){','function _matchmakeHeavy(){',1)
            start=s.find('function _matchmakeHeavy(){')
            end=s.find('\nfunction ',start+30)
            if start>=0 and end>=0:
              tail='\nfunction _showSpeedLoader(text="Подготавливаем бой…"){const e=document.getElementById("speedLoader");if(!e)return;e.querySelector("span").textContent=text;e.classList.add("show")}\nfunction _hideSpeedLoader(){document.getElementById("speedLoader")?.classList.remove("show")}\nfunction matchmake(){const f=currentF();if(!f){toast("Выбери бойца");return}_showSpeedLoader("Подбираем соперника…");requestAnimationFrame(()=>setTimeout(()=>{try{_matchmakeHeavy()}finally{_hideSpeedLoader()}},0))}\n'
              s=s[:end]+tail+s[end:]
          old='window._worldBuildTimer=setTimeout(()=>{'
          if old in s:
            s=s.replace(old,'_showSpeedLoader("Загружаем мир MMA…"); window._worldBuildTimer=setTimeout(()=>{',1)
            old2='      }catch(e){\n        console.error("World build failed",e);\n        toast("Мир ещё загружается");\n      }\n    },1200);'
            new2='      }catch(e){\n        console.error("World build failed",e);\n        toast("Мир ещё загружается");\n      }finally{\n        _hideSpeedLoader();\n      }\n    },50);'
            if old2 in s:s=s.replace(old2,new2,1)
          if s==original: raise SystemExit('no changes made')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          parts=s.split('<script>',1)
          if len(parts)!=2: raise SystemExit('script tag not found')
          js=parts[1].split('</script>',1)[0]
          Path('/tmp/game.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V45: make menus and matchmaking responsive [skip v45]'
          git push
