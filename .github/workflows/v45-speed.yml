name: V45 menu speed
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch speed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          s=s.replace('const BUILD="MMA_MANAGER_V44";','const BUILD="MMA_MANAGER_V45";',1)
          s=s.replace('<title>MMA Manager V44 • Road to Champion</title>','<title>MMA Manager V45 • Road to Champion</title>',1)

          # Critical: getPos was rebuilding all rankings for every fighter row in the roster.
          # Rankings are already maintained centrally; never rebuild them while rendering a list.
          old='function getPos(f){updateRankings();let a=s.rankings[f.weight]||[];let x=a.find(z=>z.id===f.id);return x?x.rank:"—"}'
          new='function getPos(f){let a=s.rankings[f.weight]||[];let x=a.find(z=>z.id===f.id);return x?x.rank:"—"}'
          if old not in s: raise SystemExit('getPos target not found')
          s=s.replace(old,new,1)

          # Critical: first screen must render before save normalization / ranking generation.
          old='if(!s._normalized){ normalizeSave(); s._normalized=true; }'
          new='if(!s._normalized){ s._normalized=true; setTimeout(()=>{try{normalizeSave();save();}catch(e){console.error("Deferred normalization failed",e)}},0); }'
          if old not in s: raise SystemExit('render normalization target not found')
          s=s.replace(old,new,1)

          # Small non-blocking loader for heavy matchmaking/world calculations.
          marker='</style><style id="fight-controls-v23">'
          loader_css='</style><style id="v45-speed-ui">#speedLoader{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:2147483646;display:none;align-items:center;gap:7px;padding:7px 10px;border:1px solid #343b45;border-radius:9px;background:rgba(12,16,21,.94);box-shadow:0 8px 25px #000;color:#cbd1d8;font-size:10px;font-weight:800;backdrop-filter:blur(8px)}#speedLoader.show{display:flex}#speedLoader i{width:12px;height:12px;border:2px solid #3a414b;border-top-color:#d5ae42;border-radius:50%;animation:v45spin .7s linear infinite}@keyframes v45spin{to{transform:rotate(360deg)}}.speed-placeholder{padding:22px;text-align:center;color:#8e98a4;font-size:12px}</style><style id="fight-controls-v23">'
          if marker not in s: raise SystemExit('CSS marker not found')
          s=s.replace(marker,loader_css,1)

          old='<div id="toast" class="toast"></div>'
          new='<div id="toast" class="toast"></div><div id="speedLoader"><i></i><span>Подготавливаем бой…</span></div>'
          if old not in s: raise SystemExit('loader html target not found')
          s=s.replace(old,new,1)

          # Wrap matchmaking so the tap immediately paints feedback, then heavy calculation runs off the tap stack.
          marker='function rosterProfile(i){s.selected=i;profile(s.fighters[i],"roster")}\nfunction matchmake(){'
          replacement='function rosterProfile(i){s.selected=i;profile(s.fighters[i],"roster")}\nfunction matchmake(){'
          if marker not in s: raise SystemExit('matchmake marker not found')
          # Rename the original implementation and add a fast front-end wrapper.
          s=s.replace('function matchmake(){','function _matchmakeHeavy(){',1)
          tail='\nfunction _showSpeedLoader(text="Подготавливаем бой…"){const e=document.getElementById("speedLoader");if(!e)return;e.querySelector("span").textContent=text;e.classList.add("show")}\nfunction _hideSpeedLoader(){document.getElementById("speedLoader")?.classList.remove("show")}\nfunction matchmake(){\n  const f=currentF();\n  if(!f){toast("Выбери бойца");return}\n  _showSpeedLoader("Подбираем соперника…");\n  requestAnimationFrame(()=>setTimeout(()=>{try{_matchmakeHeavy()}finally{_hideSpeedLoader()}},0));\n}\n'
          # Insert wrapper immediately before the first next function after heavy matchmaker.
          next_marker='\nfunction '
          start=s.find('function _matchmakeHeavy(){')
          if start<0: raise SystemExit('renamed matchmake not found')
          end=s.find(next_marker,start+30)
          if end<0: raise SystemExit('end of matchmake not found')
          s=s[:end]+tail+s[end:]

          # Keep the world build visibly backgrounded rather than blocking the UI with no feedback.
          old='window._worldBuildTimer=setTimeout(()=>{'
          if old in s:
            s=s.replace(old,'_showSpeedLoader("Загружаем мир MMA…"); window._worldBuildTimer=setTimeout(()=>{',1)
            old2='      }catch(e){\n        console.error("World build failed",e);\n        toast("Мир ещё загружается");\n      }\n    },1200);'
            new2='      }catch(e){\n        console.error("World build failed",e);\n        toast("Мир ещё загружается");\n      }finally{\n        _hideSpeedLoader();\n      }\n    },50);'
            if old2 in s:s=s.replace(old2,new2,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js=s[s.index('<script>')+8:s.rindex('</script>')]
          Path('/tmp/game.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V45: make menus and matchmaking responsive [skip v45]'
          git push
