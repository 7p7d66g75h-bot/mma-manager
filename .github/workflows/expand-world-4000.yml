name: Expand world to 4000

on:
  push:
    paths:
      - '.github/workflows/expand-world-4000.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update world target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'const TARGET=3200;'
          new = 'const TARGET=4000;'
          if old not in text:
              raise SystemExit('TARGET=3200 not found; refusing to modify the file.')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Increase world target to 4000 fighters'
          git push
