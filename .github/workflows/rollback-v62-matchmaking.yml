name: Rollback V62 matchmaking
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rollback:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Rollback V62 matchmaking')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove V62 matchmaking override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          before=len(s)
          s=re.sub(r'\s*<script id="MMA_MANAGER_V62_FIX">.*?</script>\s*', '\n', s, flags=re.S)
          s=s.replace('MMA_MANAGER_V62_FIX','MMA_MANAGER_V61_RESTORED',1)
          s=s.replace('MMA Manager V62 • Road to Champion','MMA Manager V61 • Road to Champion',1)
          p.write_text(s,encoding='utf-8')
          print('removed', before-len(s), 'bytes')
          assert 'MMA_MANAGER_V62_FIX' not in s
          assert 'function v62Matchmake' not in s
          PY
      - name: Commit rollback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Rollback V62 matchmaking'
          git push