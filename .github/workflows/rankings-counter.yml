name: Add rankings fighter counter

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rankings-counter.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update rankings UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('const BUILD="MMA_MANAGER_V31";', 'const BUILD="MMA_MANAGER_V32";', 1)
          s = s.replace('<title>MMA Manager V31 • Road to Champion</title>', '<title>MMA Manager V32 • Road to Champion</title>', 1)

          css = '.rank-meta{font-size:10px;color:#7f8994;font-weight:800;letter-spacing:.4px;white-space:nowrap;text-align:right}.rank-meta b{color:#d5ae42;font-size:11px}'
          marker = '.rankline{display:grid;'
          if css not in s and marker in s:
              s = s.replace(marker, css + '\n' + marker, 1)

          old = '<div class="title">Рейтинги</div>'
          new = '<div class="section-head"><div class="title" style="margin:5px 0 0">Рейтинги</div><div class="rank-meta">БОЙЦОВ В МИРЕ <b>${allPool().filter(f=>!f.retired).length.toLocaleString("ru-RU")}</b></div></div>'
          if old in s and 'БОЙЦОВ В МИРЕ' not in s:
              s = s.replace(old, new, 1)

          old_league = '<div class="section-head"><h3>${o.name}</h3><span>${o.short}</span></div>'
          new_league = '<div class="section-head"><h3>${o.name}</h3><span>${o.short} • <b>${allPool().filter(f=>f.org===o.name&&!f.retired).length}</b> бойцов</span></div>'
          if old_league in s:
              s = s.replace(old_league, new_league, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add fighter count to rankings"
          git push
