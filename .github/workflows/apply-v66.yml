name: Apply V66 refusal batch fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable organization runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/organization_v64.js').read_text(encoding='utf-8')
          assert 'window.matchmake=matchmake' in s
          assert 'function accept' in s
          print('Stable organization runtime OK')
          PY
