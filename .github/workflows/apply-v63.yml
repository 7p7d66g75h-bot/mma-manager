name: Apply V63 restore original matchmaking
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'V63 patch applied')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V63 patch
        run: python3 scripts/fix_v63.py
      - name: Validate V63
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'MMA_MANAGER_V63_FIX' in s
          assert 'MMA_MANAGER_V61_FIX' not in s
          assert 'function _matchmakeHeavy()' in s
          assert 'function matchmake()' in s
          assert 'data-change-camp' in s
          assert 'data-campstyle' in s
          assert 'Рекорд по организациям' in s
          print('V63 validation OK')
          PY
      - name: Commit V63
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'V63 patch applied'
          git push