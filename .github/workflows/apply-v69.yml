name: Apply V69 post-fight deployment
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text(encoding='utf-8')
          org=Path('scripts/organization_v64.js').read_text(encoding='utf-8')
          assert 'function offerFor' in org
          assert 'function generateOffers' in org
          assert 'function negotiateOffer' in org
          print('Stable organization runtime OK')
          PY
