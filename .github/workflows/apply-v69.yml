name: Deploy V69
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check scripts/organization_v64.js
          node --check scripts/fix_v67_refusal_runtime.py 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text(encoding='utf-8')
          org=Path('scripts/organization_v64.js').read_text(encoding='utf-8')
          assert 'organization_v64.js?v=69' in idx
          assert 'MMA_MANAGER_V69_POSTFIGHT' in idx
          assert 'id="frCareerReport"' in idx
          assert org.count('const exp=') == 1
          assert 'f.refusalOfferBatchSize=offers.length' in org
          print('V69 validation OK')
          PY
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
