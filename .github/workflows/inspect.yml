name: inspect
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for pat in [r'function\s+\w*(?:camp|profile|fight|match|bout)\w*\s*\([^)]*\)',r'window\._\w+',r'data-[\w-]+',r'Организовать[^<]{0,80}',r'Назначить[^<]{0,80}',r'Бой[^<]{0,80}']:
            out.append('\nPATTERN '+pat+'\n')
            for m in list(re.finditer(pat,s,re.I))[:80]:
              a=max(0,m.start()-220);b=min(len(s),m.end()+420)
              out.append(s[a:b].replace('\n',' ')+'\n---\n')
          Path('inspect.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspect.txt
          git commit -m 'inspect structure [skip inspect]'
          git push