name: inspect
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for name,nextname in [('profile','rosterProfile'),('camp','applyCampWeek'),('simulateFight','draw2DFight')]:
            a=s.find('function '+name+'(')
            b=s.find('function '+nextname+'(',a+1) if a>=0 else -1
            if a>=0:
              if b<0:b=min(len(s),a+30000)
              out.append('\n===== '+name+' =====\n'+s[a:b]+'\n')
          Path('inspect.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspect.txt
          git commit -m 'inspect fight logic [skip inspect]'
          git push