name: inspect
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.find('function simulateFight('); b=s.find('function draw2DFight(',a)
          q=s[a:b]
          keys=['Math.random','ovr(','f\.','o\.','a\.','b\.','sig','td','sub','stamina','score']
          out=[]
          for line in q.splitlines():
            if any(k in line for k in keys): out.append(line+'\n')
          Path('inspect.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspect.txt
          git commit -m 'inspect fight formulas [skip inspect]'
          git push