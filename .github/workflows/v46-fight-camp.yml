name: V47 fight camp
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          s=s.replace('const BUILD="MMA_MANAGER_V46";','const BUILD="MMA_MANAGER_V47";',1)
          s=re.sub(r'<title>MMA Manager V\d+ • Road to Champion</title>','<title>MMA Manager V47 • Road to Champion</title>',s,count=1)
          # HOME: no camp button here.
          s=re.sub(r'<button[^>]*data-campfighter="\$\{x\.id\}"[^>]*>Лагерь</button>','',s)
          # Default camp based on fighter archetype; saved preference overrides it.
          if 'function defaultCampStyleForFighter(' not in s:
            s=s.replace('function camp(){','function defaultCampStyleForFighter(f){const m={"Wrestler":"wrestling","Grappler":"grappling","Striker":"striking","Pressure Fighter":"conditioning","Counter Striker":"striking"};return m[f?.style]||"balanced";}\n\nfunction camp(){',1)
          # Bout acceptance: initialize current camp from saved preference or automatic fighter style.
          if 'f.preferredCampStyle=f.preferredCampStyle||null;f.campStyle=f.preferredCampStyle||defaultCampStyleForFighter(f);' not in s:
            s=s.replace('f.campWeek=1;f.campSchedule={};f.currentFightLeague=c.org;', 'f.preferredCampStyle=f.preferredCampStyle||null;f.campStyle=f.preferredCampStyle||defaultCampStyleForFighter(f);f.campWeek=1;f.campSchedule={};f.currentFightLeague=c.org;',1)
          # PROFILE: show Camp only when a bout exists.
          if 'data-profile-camp' not in s:
            s=re.sub(r'(\$\{f\.nextFight\?`<button class="primary" data-profile-fight>Предматчевый экран</button>)',r'\1<button data-profile-camp>Лагерь</button>',s,count=1)
          if 'let cb=document.querySelector("[data-profile-camp]")' not in s:
            s=s.replace('let fb=document.querySelector("[data-profile-fight]");if(fb)fb.onclick=()=>{closeModal();s.selected=s.fighters.findIndex(x=>x.id===f.id);fight()};','let fb=document.querySelector("[data-profile-fight]");if(fb)fb.onclick=()=>{closeModal();s.selected=s.fighters.findIndex(x=>x.id===f.id);fight()};let cb=document.querySelector("[data-profile-camp]");if(cb)cb.onclick=()=>{closeModal();s.selected=s.fighters.findIndex(x=>x.id===f.id);camp()};',1)
          # Old saves: give them an automatic camp immediately.
          s=re.sub(r'let selected=f\.campStyle\|\|null,c=CAMP_STYLES\.find\(x=>x\.id===selected\)\|\|null;', 'if(!f.campStyle)f.campStyle=f.preferredCampStyle||defaultCampStyleForFighter(f);let selected=f.campStyle,c=CAMP_STYLES.find(x=>x.id===selected)||CAMP_STYLES[0];save();', s,count=1)
          # Changing camp stores a reusable preference for future fights.
          s=re.sub(r'document\.querySelectorAll\("\[data-campstyle\]"\)\.forEach\(b=>b\.onclick=\(\)=>\{.*?\}\);document\.querySelector\("\[data-change-camp\]"\)\?\.addEventListener\("click",\(\)=>\{f\.campStyle=null;save\(\);camp\(\)\}\)', 'document.querySelectorAll("[data-campstyle]").forEach(b=>b.onclick=()=>{f.campStyle=b.dataset.campstyle;f.preferredCampStyle=b.dataset.campstyle;save();camp()});document.querySelector("[data-change-camp]")?.addEventListener("click",()=>{f.campStyle=null;save();camp()})', s,count=1,flags=re.S)
          # Weekly camp modifies combat attributes (existing behavior) and now also creates a fight-day form edge.
          s=s.replace('function applyCampWeek(f){ let c=CAMP_STYLES.find(x=>x.id===(f.campStyle||"balanced"))||CAMP_STYLES[0];','function applyCampWeek(f){ let c=CAMP_STYLES.find(x=>x.id===(f.campStyle||f.preferredCampStyle||defaultCampStyleForFighter(f)))||CAMP_STYLES[0];',1)
          s=s.replace('f.fatigue=clamp(f.fatigue+c.fatigue);f.form=clamp(100-f.fatigue*.6+(f.morale-70)*.2);s.trainingPoints=7;','f.fatigue=clamp(f.fatigue+c.fatigue);let campFormBonus=c.id==="peak"?8:c.id==="conditioning"?5:c.id==="striking"||c.id==="wrestling"||c.id==="grappling"?3:1;f.form=clamp(100-f.fatigue*.6+(f.morale-70)*.2+campFormBonus);f.campPerformance=campFormBonus;s.trainingPoints=7;',1)
          # Preserve preference after fight; clear only the current camp performance.
          s=s.replace('f.nextFight=null;f.campWeek=0;f.campSchedule={};f.campStyle=null;','f.nextFight=null;f.campWeek=0;f.campSchedule={};f.campStyle=f.preferredCampStyle||null;f.campPerformance=0;',1)
          if s==original: raise SystemExit('no changes made')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not blocks: raise SystemExit('no script block found')
          Path('/tmp/game.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'V47: move camp to fighter profile and make camp affect preparation [skip v47]'
          git pull --rebase origin main
          git push origin HEAD:main