name: V49 camp and matchmaking
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          s=re.sub(r'const BUILD="MMA_MANAGER_V\d+";','const BUILD="MMA_MANAGER_V49";',s,count=1)
          s=re.sub(r'<title>MMA Manager V\d+ • Road to Champion</title>','<title>MMA Manager V49 • Road to Champion</title>',s,count=1)

          # CAMP: the change button must open the list instead of immediately restoring the default camp.
          old='if(!f.campStyle)f.campStyle=f.preferredCampStyle||defaultCampStyleForFighter(f);let selected=f.campStyle,c=CAMP_STYLES.find(x=>x.id===selected)||CAMP_STYLES[0];save();'
          new='if(!f.campStyle&&!f.campChanging)f.campStyle=f.preferredCampStyle||defaultCampStyleForFighter(f);let selected=f.campStyle,c=CAMP_STYLES.find(x=>x.id===selected)||null;if(c&&!f.campChanging)save();'
          if old not in s: raise SystemExit('camp selection target not found')
          s=s.replace(old,new,1)
          old='document.querySelectorAll("[data-campstyle]").forEach(b=>b.onclick=()=>{f.campStyle=b.dataset.campstyle;f.preferredCampStyle=b.dataset.campstyle;save();camp()});document.querySelector("[data-change-camp]")?.addEventListener("click",()=>{f.campStyle=null;save();camp()});bind()'
          new='document.querySelectorAll("[data-campstyle]").forEach(b=>b.onclick=()=>{f.campStyle=b.dataset.campstyle;f.preferredCampStyle=b.dataset.campstyle;f.campChanging=false;save();camp()});document.querySelector("[data-change-camp]")?.addEventListener("click",()=>{f.campStyle=null;f.campChanging=true;save();camp()});bind()'
          if old not in s: raise SystemExit('camp button binding target not found')
          s=s.replace(old,new,1)

          # LEAGUE OFFERS: variable number (usually 1-2, sometimes 3), and avoid repeatedly offering the same leagues.
          old='let count=Math.random()<.62?1:(Math.random()<.86?2:3);\n   let selected=all.sort((x,y)=>Math.abs(x.level-rating/10)-Math.abs(y.level-rating/10)).slice(0,count);\n   offers=selected.map(o=>{let t=contractTerms(f,o);return {org:o.name,short:o.short,level:o.level,fights:choice([3,3,4]),salary:Math.max(t.salary,Math.round(t.salary*(.85+Math.random()*.25)))};});'
          new='let count=Math.random()<.48?1:(Math.random()<.82?2:3);\n   let recentOfferOrgs=new Set((f.leagueOfferHistory||[]).filter(x=>s.day-(x.day||0)<120).map(x=>x.org));\n   let ranked=all.slice().sort((a,b)=>Math.abs(a.level-rating/10)-Math.abs(b.level-rating/10));\n   let fresh=ranked.filter(o=>!recentOfferOrgs.has(o.name));\n   let pool=fresh.length>=count?fresh:fresh.concat(ranked.filter(o=>!fresh.includes(o)));\n   pool=pool.sort(()=>Math.random()-.5);\n   let selected=pool.slice(0,Math.min(count,pool.length));\n   offers=selected.map(o=>{let t=contractTerms(f,o);return {org:o.name,short:o.short,level:o.level,fights:choice([3,3,4]),salary:Math.max(t.salary,Math.round(t.salary*(.85+Math.random()*.25)))};});\n   f.leagueOfferHistory=[...(f.leagueOfferHistory||[]),...selected.map(o=>({org:o.name,day:s.day}))].slice(-12);'
          if old not in s: raise SystemExit('league offer target not found')
          s=s.replace(old,new,1)

          # MATCHMAKING: remember recently offered opponents so advancing time / reopening matchmaking does not recycle the same names.
          old='let recentOpponents=new Set((f.history||[]).slice(0,3).map(h=>h.opponent).filter(Boolean));\n let matchIndex=new Map();'
          new='let recentOpponents=new Set((f.history||[]).slice(0,3).map(h=>h.opponent).filter(Boolean));\n let recentOfferedOpponents=new Set((f.matchmakeSeen||[]).filter(x=>s.day-(x.day||0)<60).map(x=>x.name));\n let matchIndex=new Map();'
          if old not in s: raise SystemExit('matchmaking history target not found')
          s=s.replace(old,new,1)
          old='if(!x||x.agencyManaged||x.name===f.name||x.weight!==f.weight||recentOpponents.has(x.name))continue;'
          new='if(!x||x.agencyManaged||x.name===f.name||x.weight!==f.weight||recentOpponents.has(x.name)||recentOfferedOpponents.has(x.name))continue;'
          if old not in s: raise SystemExit('matchmaking filter target not found')
          s=s.replace(old,new,1)
          old='if(!candidates.length){toast(contracted?`В ${f.contract.org} сейчас нет подходящего соперника.`:"Сейчас нет подходящих предложений. Попробуй позже.");return}\n document.getElementById("modal").classList.add("open");'
          new='if(!candidates.length){toast(contracted?`В ${f.contract.org} сейчас нет подходящего соперника.`:"Сейчас нет подходящих предложений. Попробуй позже.");return}\n f.matchmakeSeen=[...(f.matchmakeSeen||[]),...candidates.map(c=>({name:c.opponent.name,day:s.day}))].slice(-20);\n save();\n document.getElementById("modal").classList.add("open");'
          if old not in s: raise SystemExit('matchmaking save target not found')
          s=s.replace(old,new,1)

          if s==original: raise SystemExit('no changes made')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not blocks: raise SystemExit('no script block found')
          Path('/tmp/game.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'V49: fix camp switching and diversify league offers and opponents [skip v49]'
          git pull --rebase origin main
          git push origin HEAD:main
