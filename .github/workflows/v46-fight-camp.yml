name: V47 fight camp
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8');original=s
          s=s.replace('const BUILD="MMA_MANAGER_V47";','const BUILD="MMA_MANAGER_V48";',1)
          s=re.sub(r'<title>MMA Manager V\d+ • Road to Champion</title>','<title>MMA Manager V48 • Road to Champion</title>',s,count=1)
          # Camp preference is initialized on bout acceptance.
          target='f.preferredCampStyle=f.preferredCampStyle||null;f.campStyle=f.preferredCampStyle||defaultCampStyleForFighter(f);f.campWeek=1;f.campSchedule={};f.currentFightLeague=c.org;'
          if target in s and 'f.campPerformance=' not in s[s.find(target):s.find(target)+500]:
            repl='f.preferredCampStyle=f.preferredCampStyle||null;f.campStyle=f.preferredCampStyle||defaultCampStyleForFighter(f);f.campPerformance=f.campStyle==="peak"?8:(f.campStyle==="conditioning"?5:3);f.campWeek=1;f.campSchedule={};f.currentFightLeague=c.org;'
            s=s.replace(target,repl,1)
          # The simulation already calculates a live fight edge from form; add the camp's explicit fight-day edge.
          old='let edge=(ovr(f)-ovr(o))/120+(f.form-o.form)/320+(a.stamina-b.stamina)/500;'
          new='let edge=(ovr(f)-ovr(o))/120+(f.form-o.form)/320+(a.stamina-b.stamina)/500+(f.campPerformance||0)/100;'
          s=s.replace(old,new,1)
          # A grappling/wrestling camp should also improve the existing takedown edge.
          old='let tdEdge=((f.takedown||f.wrest)- (o.takedown||o.wrest))/180;'
          new='let tdEdge=((f.takedown||f.wrest)- (o.takedown||o.wrest))/180+(f.campStyle==="wrestling"?0.035:f.campStyle==="grappling"?0.025:0);'
          s=s.replace(old,new,1)
          # Keep camp preference after fight; only the current camp-performance edge is cleared.
          old='f.nextFight=null;f.campWeek=0;f.campSchedule={};f.campStyle=f.preferredCampStyle||null;f.campPerformance=0;'
          new='f.nextFight=null;f.campWeek=0;f.campSchedule={};f.campStyle=f.preferredCampStyle||null;f.campPerformance=0;'
          s=s.replace(old,new,1)
          if s==original: raise SystemExit('no changes made')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not blocks: raise SystemExit('no script block found')
          Path('/tmp/game.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'V48: make camp affect fight simulation [skip v48]'
          git pull --rebase origin main
          git push origin HEAD:main