name: V80 opponent profile fix
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v80_opponent_profile_fix.js'
      - 'index.html'
      - '.github/workflows/v80-opponent-profile.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install V80 runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="scripts/v80_opponent_profile_fix.js?v=80"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html has no </body>')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s, encoding='utf-8')
          print('V80 runtime installed')
          PY
      - name: Validate
        run: |
          node --check scripts/v80_opponent_profile_fix.js
          grep -q 'v80_opponent_profile_fix.js?v=80' index.html
      - name: Commit
        run: |
          git config user.name 'mma-manager-bot'
          git config user.email 'mma-manager-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'V80: install opponent profile runtime [skip ci]'
          git push
