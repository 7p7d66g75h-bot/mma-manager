name: Rollback matchmaking to V45
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'V45 matchmaking restored')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore V45 matchmaking
        run: python3 scripts/rollback_matchmaking_v45.py
      - name: Validate matchmaking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'function _matchmakeHeavy()' in s
          assert 'matchmakeSeen' not in s[s.index('function _matchmakeHeavy()'):s.index('const CAMP_STYLES=')]
          assert 'acceptFightDisciplineBonus(f);' not in s[s.index('function _matchmakeHeavy()'):s.index('const CAMP_STYLES=')]
          assert 'function matchmake(){' in s
          print('V45 matchmaking validation OK')
          PY
      - name: Commit restored matchmaking
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'V45 matchmaking restored'
          git push