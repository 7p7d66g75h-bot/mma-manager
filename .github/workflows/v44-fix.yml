name: V44 performance fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          # Build number: invalidate stale browser/service-worker state.
          s=s.replace('const BUILD="MMA_MANAGER_V38";','const BUILD="MMA_MANAGER_V44";',1)
          s=s.replace('<title>MMA Manager V38 • Road to Champion</title>','<title>MMA Manager V44 • Road to Champion</title>',1)

          # Do not block the first screen with synchronous generation of the 4,000-fighter world.
          marker='window._worldBuildTimer=setTimeout(()=>{'
          pos=s.find(marker)
          if pos<0:
              raise SystemExit('world build timer marker not found')
          end=s.find('},50);',pos)
          if end<0:
              raise SystemExit('world build timer end not found')
          block=s[pos:end+6]
          newblock=block.replace('},50);','},1200);',1)
          s=s[:pos]+newblock+s[end+6:]

          # Matchmaking: stop calling updateRankings through getPos for every candidate.
          old='let fp=getPos(f);'
          new='const rankMap=new Map((s.rankingsByOrg?.[org.name]?.[f.weight]||[]).map(r=>[r.id,r.rank])); let fp=rankMap.get(f.id)||999;'
          if old not in s:
              raise SystemExit('matchmaking fighter rank target not found')
          s=s.replace(old,new,1)
          old='let rp=getPos(x);'
          new='let rp=rankMap.get(x.id)||999;'
          if old not in s:
              raise SystemExit('matchmaking opponent rank target not found')
          s=s.replace(old,new,1)

          # The fight result statistics button must open stats immediately and remain above every overlay.
          old='ov.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.82);padding:18px;overflow:auto";'
          new='ov.style.cssText="position:fixed;inset:0;z-index:2147483646;background:rgba(0,0,0,.90);padding:18px;overflow:auto;pointer-events:auto;touch-action:manipulation";'
          if old not in s:
              raise SystemExit('fight stats overlay target not found')
          s=s.replace(old,new,1)

          # Make the result-statistics action explicit and immediate.
          old='document.getElementById("frStats").onclick=()=>{\n   if(typeof openFightStatsOverlay==="function") openFightStatsOverlay();\n };'
          new='document.getElementById("frStats").onclick=(e)=>{\n   e.preventDefault(); e.stopPropagation();\n   if(typeof openFightStatsOverlay==="function") openFightStatsOverlay();\n };'
          if old not in s:
              raise SystemExit('result statistics handler target not found')
          s=s.replace(old,new,1)

          if s==original:
              raise SystemExit('no changes made')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js=s[s.index('<script>')+8:s.rindex('</script>')]
          Path('/tmp/game.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m 'V44: performance and fight stats fixes'
          git push