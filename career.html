<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090c">
<title>MMA Manager — Career</title>
<style>
:root{--bg:#07090c;--panel:#101419;--panel2:#151a20;--line:#2a3038;--gold:#d5ae42;--muted:#8e98a4;--text:#f4f5f6;--green:#48a56d;--red:#c65d5d;--blue:#668fc5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100dvh}button,input,select{font:inherit}button{border:1px solid #343b45;background:#20262e;color:#fff;border-radius:9px;min-height:46px;padding:11px 13px;font-weight:800;touch-action:manipulation}button:active{transform:scale(.99)}button.primary{background:linear-gradient(90deg,#d7b24a,#a27c25);color:#0b0c0e;border-color:#d8b550}button.green{background:#244f36;border-color:#376e4c}button.red{background:#542a2a;border-color:#814141}.app{width:min(760px,100%);min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 12px calc(85px + env(safe-area-inset-bottom));overflow:hidden}.top{padding:16px 4px 12px;border-bottom:1px solid #20252d;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:1.5px;font-size:18px}.brand span{color:var(--gold)}.date{font-size:11px;color:var(--muted);text-align:right}.screen{padding-top:14px}.hidden{display:none!important}.panel{background:linear-gradient(145deg,#151a20,#0e1217);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:10px}.eyebrow{font-size:10px;letter-spacing:1.6px;color:#9da6af;font-weight:900}.title{font-size:28px;font-weight:950;margin:5px 0 7px}.muted{color:var(--muted);font-size:12px}.gold{color:var(--gold)}.menu{display:grid;gap:8px;margin-top:20px}.menu button{text-align:left;padding:15px 16px;min-height:58px;background:linear-gradient(145deg,#171c22,#0e1217);border-color:#303740}.menu button b{display:block;font-size:15px}.menu button small{display:block;color:var(--muted);margin-top:3px;font-weight:500}.menu button.primary{background:linear-gradient(90deg,#d7b24a,#a27c25)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#0c1015;border:1px solid #272e37;border-radius:8px;padding:10px}.stat small{display:block;color:#7f8994;font-size:9px;text-transform:uppercase}.stat b{display:block;margin-top:3px;font-size:17px}.field{margin-top:10px}.field label{display:block;color:#9da6af;font-size:10px;font-weight:800;margin-bottom:5px}.input,select{width:100%;background:#090d12;border:1px solid #343b45;color:#fff;border-radius:8px;padding:13px;outline:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.actions.one{grid-template-columns:1fr}.choicegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.choice{background:#11161c;border:1px solid #303740;border-radius:9px;padding:11px;text-align:left;cursor:pointer}.choice.selected{border-color:var(--gold);box-shadow:0 0 0 1px #d5ae4233}.choice b{display:block}.choice small{display:block;color:var(--muted);margin-top:3px}.portrait{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#353d47,#151a20);border:2px solid #4a525c;font-size:45px;margin:4px auto 12px}.facegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.face{height:58px;border-radius:9px;background:#171d24;border:1px solid #303740;display:grid;place-items:center;font-size:28px;cursor:pointer}.face.selected{border-color:var(--gold)}.bar{height:8px;background:#292f37;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#987423,#dfbb4e)}.fighterhead{display:flex;gap:12px;align-items:center}.fighterportrait{width:70px;height:70px;border-radius:10px;display:grid;place-items:center;background:#242b34;border:1px solid #46505c;font-size:34px}.grow{flex:1;min-width:0}.fightername{font-size:20px;font-weight:950}.record{font-size:12px;color:var(--muted);margin-top:3px}.money{font-size:20px;font-weight:950;color:#e7c55c}.section{margin:15px 0 8px;display:flex;justify-content:space-between;align-items:end}.section h3{margin:0;font-size:16px}.section span{font-size:10px;color:var(--muted)}.list{display:grid;gap:7px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#11161c;border:1px solid #303740;border-radius:9px;padding:11px}.rank{font-size:20px;font-weight:950;color:var(--gold);width:35px}.rank b{font-size:14px;color:#fff}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:55px;background:#0c1015;border:1px solid #272e37;border-radius:6px;padding:5px;font-size:10px}.day b{color:#7f8994}.day.train{border-color:#7b6327}.day.spar{border-color:#7b3f3f}.day.fight{border-color:var(--gold);background:#1d190f}.day.rest{border-color:#326246}.badge{display:inline-block;padding:4px 7px;border-radius:5px;background:#20262e;color:#bac1c9;font-size:9px;font-weight:900}.win{color:#63c78a}.loss{color:#dc7777}.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(8,10,13,.97);border-top:1px solid #272d35;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}.bottom button{background:transparent;border:0;min-height:48px;color:#7e8894;font-size:10px;padding:4px}.bottom button b{display:block;font-size:17px;margin-bottom:1px}.bottom button.active{color:var(--gold)}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(760px,100%);max-height:92dvh;overflow:auto;background:#0b0f14;border:1px solid #303740;border-radius:15px 15px 0 0;padding:15px;margin:auto auto 0}.sheet h2{margin:0 0 5px}.fightgrid{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;align-items:center;text-align:center}.corner .face2{width:64px;height:64px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#242b34;border:1px solid #46505c;font-size:31px}.vs{font-size:22px;font-weight:950;color:var(--gold)}.roundbox{text-align:center;background:#11161c;border:1px solid #303740;border-radius:9px;padding:10px;margin:9px 0}.log{height:90px;overflow:auto;background:#080c10;border:1px solid #272e37;border-radius:8px;padding:8px;font-size:11px;color:#c5cbd1}.fightbuttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.fightbuttons button{min-height:42px;font-size:10px}.notice{padding:10px;border-left:3px solid var(--gold);background:#151a20;border-radius:6px;font-size:11px;color:#c5cbd1;margin:8px 0}
@media(min-width:600px){.menu{grid-template-columns:1fr 1fr}.choicegrid{grid-template-columns:repeat(3,1fr)}.bottom{width:min(760px,100%);left:50%;right:auto;transform:translateX(-50%);border-left:1px solid #272d35;border-right:1px solid #272d35}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">MMA <span>MANAGER</span></div><div class="date" id="topDate">CAREER MODE</div></header>
<main class="screen" id="screen"></main>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='mmaCareerV1';
const weights=['Flyweight','Bantamweight','Featherweight','Lightweight','Welterweight','Middleweight','Light Heavyweight','Heavyweight'];
const archetypes={Striker:{speed:78,power:72,technique:76,wrestling:45,grappling:48,cardio:67,chin:62},Wrestler:{speed:62,power:62,technique:55,wrestling:82,grappling:76,cardio:76,chin:72},Grappler:{speed:58,power:58,technique:52,wrestling:70,grappling:86,cardio:72,chin:68},Balanced:{speed:68,power:66,technique:68,wrestling:66,grappling:65,cardio:70,chin:68}};
let game=JSON.parse(localStorage.getItem(KEY)||'null');
function save(){localStorage.setItem(KEY,JSON.stringify(game))}
function baseGame(){return {version:1,created:false,screen:'menu',settings:{difficulty:'Normal',sound:true},fighter:null,date:{year:2026,month:1,day:1},money:5000,energy:100,week:1,rank:0,league:'UFC',contract:null,history:[],schedule:[],opponents:[],savedSlots:[]}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){if(!game)game=baseGame();document.getElementById('topDate').textContent=game.created?`${game.date.day} / ${game.date.month} / ${game.date.year} · UFC`:'CAREER MODE';if(game.screen==='menu')menu();else if(game.screen==='create')create();else if(game.screen==='career')career();else if(game.screen==='training')training();else if(game.screen==='fight')fightList();else if(game.screen==='settings')settings();else if(game.screen==='load')load();}
function menu(){game.created=false;document.getElementById('screen').innerHTML=`<div class="panel" style="margin-top:18vh;text-align:center"><div class="eyebrow">ROAD TO CHAMPION</div><div class="title">MMA CAREER</div><div class="muted">Построй карьеру бойца от первого профессионального контракта до титула UFC.</div></div><div class="menu"><button class="primary" onclick="newGame()"><b>Новая игра</b><small>Создать бойца и начать карьеру</small></button><button onclick="continueGame()"><b>Продолжить игру</b><small>${hasSave()?'Продолжить последнюю карьеру':'Нет активной карьеры'}</small></button><button onclick="openLoad()"><b>Загрузить игру</b><small>Сохранённые карьеры</small></button><button onclick="go('settings')"><b>Настройки</b><small>Сложность, интерфейс и сохранение</small></button></div>`}
function hasSave(){return !!(localStorage.getItem(KEY+'_active'))}
function newGame(){game=baseGame();game.screen='create';save();render()}
function continueGame(){let raw=localStorage.getItem(KEY+'_active');if(!raw){toast('Сохранения нет');return}game=JSON.parse(raw);game.screen='career';render()}
function create(){let f=game.fighter||{first:'',last:'',nickname:'',age:21,height:175,weight:'Lightweight',stance:'Orthodox',archetype:'Balanced',face:'🥊',country:'Russia'};game.fighter=f;document.getElementById('screen').innerHTML=`<div class="panel"><div class="eyebrow">NEW CAREER</div><div class="title">Создание бойца</div><div class="muted">Сначала создаём персонажа. Дальше его карьера будет развиваться через тренировки, бои, деньги, рейтинги и контракты.</div></div><div class="panel"><div class="portrait" id="portrait">${f.face}</div><div class="facegrid">${['🥊','🧔','👊','🦁','🐺','🦂','🦅','🔥'].map(x=>`<div class="face ${x===f.face?'selected':''}" onclick="pickFace('${x}')">${x}</div>`).join('')}</div><div class="grid2"><div class="field"><label>Имя</label><input class="input" id="first" value="${esc(f.first)}" placeholder="Александр"></div><div class="field"><label>Фамилия</label><input class="input" id="last" value="${esc(f.last)}" placeholder="Боец"></div></div><div class="field"><label>Прозвище</label><input class="input" id="nick" value="${esc(f.nickname)}" placeholder="The Russian"></div><div class="grid3"><div class="field"><label>Возраст</label><input class="input" id="age" type="number" min="18" max="40" value="${f.age}"></div><div class="field"><label>Рост, см</label><input class="input" id="height" type="number" value="${f.height}"></div><div class="field"><label>Страна</label><input class="input" id="country" value="${esc(f.country)}"></div></div><div class="field"><label>Весовая категория</label><select id="weight">${weights.map(w=>`<option ${w===f.weight?'selected':''}>${w}</option>`).join('')}</select></div><div class="field"><label>Стойка</label><select id="stance"><option ${f.stance==='Orthodox'?'selected':''}>Orthodox</option><option ${f.stance==='Southpaw'?'selected':''}>Southpaw</option><option ${f.stance==='Switch'?'selected':''}>Switch</option></select></div></div><div class="panel"><div class="section"><h3>Архетип</h3><span>базовая специализация</span></div><div class="choicegrid">${Object.keys(archetypes).map(a=>`<div class="choice ${a===f.archetype?'selected':''}" onclick="pickArch('${a}')"><b>${a}</b><small>${archText(a)}</small></div>`).join('')}</div></div><div class="notice">Стартовые параметры не делают бойца готовым чемпионом. Рост характеристик будет зависеть от лагеря, денег, здоровья, формы и результатов боёв.</div><div class="actions"><button onclick="go('menu')">Назад</button><button class="primary" onclick="finishCreate()">Начать карьеру</button></div>`}
function archText(a){return {Striker:'Ударная техника, скорость и мощь',Wrestler:'Борьба, контроль и кардио',Grappler:'Партер, сабмишены и контроль',Balanced:'Ровное развитие всех зон'}[a]}
function pickFace(x){game.fighter.face=x;save();create()}
function pickArch(x){game.fighter.archetype=x;save();create()}
function finishCreate(){let f=game.fighter;f.first=document.getElementById('first').value.trim();f.last=document.getElementById('last').value.trim();f.nickname=document.getElementById('nick').value.trim();f.age=+document.getElementById('age').value||21;f.height=+document.getElementById('height').value||175;f.country=document.getElementById('country').value.trim()||'Russia';f.weight=document.getElementById('weight').value;f.stance=document.getElementById('stance').value;if(!f.first||!f.last){toast('Заполни имя и фамилию');return}let a=archetypes[f.archetype];f.stats={...a};f.maxEnergy=100;f.wins=0;f.losses=0;f.draws=0;f.streak=0;f.ko=0;f.sub=0;f.dec=0;f.injured=0;f.fame=5;f.skill=Object.values(a).reduce((s,v)=>s+v,0)/Object.keys(a).length;f.proWins=0;f.proLosses=0;f.amateurRecord='0-0';game.created=true;game.screen='career';game.money=5000;game.energy=100;game.rank=0;game.contract={league:'UFC',show:2500,win:2500,years:2};game.history=[];game.schedule=[];saveActive();save();render()}
function saveActive(){localStorage.setItem(KEY+'_active',JSON.stringify(game))}
function fighterName(){let f=game.fighter;return `${f.first} ${f.last}`}
function career(){let f=game.fighter;document.getElementById('screen').innerHTML=`<div class="panel"><div class="fighterhead"><div class="fighterportrait">${f.face}</div><div class="grow"><div class="fightername">${esc(fighterName())}</div><div class="record">${f.nickname?`“${esc(f.nickname)}” · `:''}${f.weight} · ${f.stance}</div><div class="record">UFC · ${f.wins}-${f.losses}${f.draws?'-'+f.draws:''} · ${f.streak>0?'W'+f.streak:'NO STREAK'}</div></div><div class="money">$${game.money.toLocaleString()}</div></div><div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:10px;color:#8e98a4"><span>ФОРМА</span><b>${game.energy}%</b></div><div class="bar"><i style="width:${game.energy}%"></i></div></div></div><div class="grid3"><div class="stat"><small>Рейтинг</small><b>${game.rank?`#${game.rank}`:'UNRANKED'}</b></div><div class="stat"><small>Серия</small><b>${f.streak} W</b></div><div class="stat"><small>Слава</small><b>${f.fame}</b></div></div><div class="section"><h3>Карьера</h3><span>неделя ${game.week}</span></div><div class="panel"><div class="grid2"><div><div class="eyebrow">ЛИГА</div><div style="font-size:21px;font-weight:950;margin-top:4px">UFC</div><div class="muted">Единственная лига на текущем этапе</div></div><div><div class="eyebrow">КОНТРАКТ</div><div style="font-size:15px;font-weight:900;margin-top:4px">$${game.contract.show} + $${game.contract.win}</div><div class="muted">show / win</div></div></div></div><div class="section"><h3>Следующий шаг</h3></div><div class="menu"><button onclick="go('training')"><b>Тренировочный лагерь</b><small>Развивай характеристики, восстанавливай форму</small></button><button onclick="go('fight')"><b>Бои UFC</b><small>Выбери соперника и выйди в октагон</small></button><button onclick="openProfile()"><b>Профиль бойца</b><small>Полная статистика, рекорд и навыки</small></button></div>`}
function training(){let f=game.fighter;document.getElementById('screen').innerHTML=`<div class="panel"><div class="eyebrow">TRAINING CAMP</div><div class="title">Тренировки</div><div class="muted">Каждая тренировка тратит форму. После недели восстанавливаются энергия и деньги за счёт расходов лагеря.</div></div><div class="grid3"><div class="stat"><small>Форма</small><b>${game.energy}</b></div><div class="stat"><small>Деньги</small><b>$${game.money}</b></div><div class="stat"><small>Неделя</small><b>${game.week}</b></div></div><div class="section"><h3>Занятия</h3></div><div class="list">${trainCard('speed','Скорость','Лапы, реакция, взрывная работа',3,180)}${trainCard('power','Сила удара','ОФП, мешок, силовая работа',3,180)}${trainCard('technique','Техника','Комбинации, дистанция, защита',4,220)}${trainCard('wrestling','Борьба','Проходы, клетка, контроль',4,220)}${trainCard('grappling','Грэпплинг','Позиции, сабмишены, выходы',4,220)}${trainCard('cardio','Кардио','Выносливость и восстановление',2,140)}</div><div class="actions"><button onclick="restWeek()">Завершить неделю</button><button class="primary" onclick="go('career')">В карьеру</button></div>`}
function trainCard(stat,title,desc,cost,money){return `<div class="row"><div class="grow"><b>${title}</b><div class="muted">${desc}</div><span class="badge">+1–2 · -${cost}% формы · $${money}</span></div><button onclick="train('${stat}',${cost},${money})">Тренировать</button></div>`}
function train(stat,cost,money){let f=game.fighter;if(game.energy<cost){toast('Недостаточно формы');return}if(game.money<money){toast('Не хватает денег');return}let gain=1+Math.random()*1.4;f.stats[stat]=Math.min(100,+(f.stats[stat]+gain).toFixed(1));game.energy-=cost;game.money-=money;f.skill=Object.values(f.stats).reduce((s,v)=>s+v,0)/Object.keys(f.stats).length;saveActive();save();toast(`${stat.toUpperCase()} +${gain.toFixed(1)}`);training()}
function restWeek(){game.week++;game.energy=Math.min(100,game.energy+65);game.date.day+=7;if(game.date.day>28){game.date.day=1;game.date.month++;if(game.date.month>12){game.date.month=1;game.date.year++}}game.money=Math.max(0,game.money-300);saveActive();save();toast('Неделя завершена');training()}
function fightList(){let f=game.fighter;let opp=makeOpponents();document.getElementById('screen').innerHTML=`<div class="panel"><div class="eyebrow">UFC FIGHT NIGHT</div><div class="title">Выбор боя</div><div class="muted">${f.weight} · ${f.wins}-${f.losses} · ${game.rank?'#'+game.rank:'без рейтинга'}</div></div><div class="notice">Соперник влияет на риск, гонорар, рейтинг и шанс получить бонус. На первом этапе вся карьерная система работает внутри UFC.</div><div class="list">${opp.map((o,i)=>`<div class="panel"><div class="fighterhead"><div class="fighterportrait">${o.face}</div><div class="grow"><div class="fightername">${o.name}</div><div class="record">${o.record} · ${o.style}</div><div class="record">Рейтинг: ${o.rank?'#'+o.rank:'без рейтинга'} · опасность ${o.level}/100</div></div><span class="badge">$${o.show+$fBonus(o)} + WIN</span></div><div class="actions"><button onclick="openFight(${i})">Смотреть бой</button><button class="primary" onclick="startFight(${i})">Принять бой</button></div></div>`).join('')}</div>`}
function $fBonus(o){return o.show}
function makeOpponents(){let f=game.fighter;let base=['Nikolai Volkov','Marcus Reed','Diego Santos','Mateo Silva','Ryan Carter','Victor Petrov'];return base.map((n,i)=>({name:n,face:['🦁','🐺','🦂','🦅','👊','🥊'][i],record:`${8+i}-${3+i}`,style:['Striker','Wrestler','Grappler','Balanced','Striker','Wrestler'][i],rank:i<2?i+12:0,level:55+i*6,show:1800+i*250,win:1800+i*250,stats:{speed:60+i*4,power:62+i*3,technique:61+i*3,wrestling:55+i*4,grappling:54+i*4,cardio:63+i*2,chin:65+i*2}}))}
let pendingFight=null;
function openFight(i){pendingFight=makeOpponents()[i];modalFightPreview()}
function modalFightPreview(){let o=pendingFight;document.getElementById('sheet').innerHTML=`<div class="eyebrow">MATCHUP</div><h2>${esc(o.name)}</h2><div class="fighterhead"><div class="fighterportrait">${o.face}</div><div class="grow"><div class="record">${o.record} · ${o.style}</div><div class="record">Рейтинг ${o.rank?'#'+o.rank:'—'}</div></div></div><div class="grid3" style="margin-top:10px"><div class="stat"><small>Угроза</small><b>${o.level}</b></div><div class="stat"><small>Show</small><b>$${o.show}</b></div><div class="stat"><small>Win</small><b>$${o.win}</b></div></div><div class="sheet-actions"><button onclick="closeModal()">Отмена</button><button class="primary" onclick="closeModal();acceptPending()">Принять</button></div>`;openModal()}
function acceptPending(){let idx=makeOpponents().findIndex(x=>x.name===pendingFight.name);startFight(idx)}
function startFight(i){if(game.energy<35){toast('Сначала восстанови форму');return}pendingFight=makeOpponents()[i];fightSim()} 
function fightSim(){let o=pendingFight,f=game.fighter;let p=Math.max(.08,Math.min(.92,.5+(f.skill-70)/120+(f.stats.chin-o.stats.power)/500));let round=1,done=false,log=[];openModal();function draw(){document.getElementById('sheet').innerHTML=`<div class="eyebrow">UFC OCTAGON</div><div class="fightgrid"><div class="corner"><div class="face2">${f.face}</div><b>${esc(fighterName())}</b><span>${f.wins}-${f.losses}</span></div><div class="vs">VS</div><div class="corner"><div class="face2">${o.face}</div><b>${esc(o.name)}</b><span>${o.record}</span></div></div><div class="roundbox">ROUND ${round} / 3</div><div class="log">${log.slice(-8).map(x=>`<div>${x}</div>`).join('')||'Бой начинается...'}</div><div class="fightbuttons"><button onclick="fightAction('strike')">Удары</button><button onclick="fightAction('wrestle')">Борьба</button><button onclick="fightAction('grapple')">Партер</button></div><div class="notice">Сила бойца: ${f.skill.toFixed(1)} · Шанс победы сейчас: ${Math.round(p*100)}%</div>`};window.fightAction=function(type){if(done)return;let r=Math.random(),win=r<p;let method;if(type==='grapple'&&win)method='SUBMISSION';else if(type==='strike'&&win&&Math.random()<.45)method='KO/TKO';else method='DECISION';if(win){log.push(`<span class="win">${fighterName()} успешно проводит ${type}.</span>`)}else{log.push(`<span class="loss">${o.name} отвечает и забирает эпизод.</span>`)}if(log.length>=6){done=true;finishFight(win,method,o,log);return}if(log.length%2===0)round=Math.min(3,round+1);draw()};draw()}
function finishFight(win,method,o,log){let f=game.fighter;game.money+=o.show+(win?o.win:0);game.energy=Math.max(0,game.energy-35);if(win){f.wins++;f.proWins++;f.streak++;f.fame+=Math.max(1,Math.round(o.level/25));if(method==='KO/TKO')f.ko++;if(method==='SUBMISSION')f.sub++;if(game.rank===0&&f.wins>=3)game.rank=15;else if(game.rank>1)game.rank--}else{f.losses++;f.proLosses++;f.streak=0;f.fame=Math.max(0,f.fame-1);if(game.rank)game.rank=Math.min(15,game.rank+2)}f.record=`${f.wins}-${f.losses}`;game.history.unshift({date:`${game.date.day}/${game.date.month}/${game.date.year}`,opponent:o.name,result:win?'WIN':'LOSS',method,purse:o.show+(win?o.win:0)});game.week++;game.date.day+=7;game.energy=Math.min(100,game.energy+30);saveActive();save();document.getElementById('sheet').innerHTML=`<div class="eyebrow">OFFICIAL RESULT</div><div style="text-align:center;padding:18px 0"><div style="font-size:13px;color:#9da6af">${win?'ПОБЕДА':'ПОРАЖЕНИЕ'}</div><div style="font-size:38px;font-weight:950" class="${win?'win':'loss'}">${win?'W':'L'}</div><div class="winner-name">${win?esc(fighterName()):esc(o.name)}</div><div class="muted">победа методом ${method}</div></div><div class="grid3"><div class="stat"><small>Рекорд</small><b>${f.wins}-${f.losses}</b></div><div class="stat"><small>Гонорар</small><b>$${o.show+(win?o.win:0)}</b></div><div class="stat"><small>Рейтинг</small><b>${game.rank?'#'+game.rank:'—'}</b></div></div><div class="sheet-actions"><button class="primary" onclick="closeModal();go('career')">Продолжить карьеру</button></div>`}
function openProfile(){let f=game.fighter;openModal();document.getElementById('sheet').innerHTML=`<div class="eyebrow">FIGHTER PROFILE</div><div class="fighterhead"><div class="fighterportrait">${f.face}</div><div class="grow"><div class="fightername">${esc(fighterName())}</div><div class="record">${f.weight} · ${f.stance} · ${f.age} лет</div><div class="record">${f.country} · ${f.nickname?`“${esc(f.nickname)}”`:''}</div></div></div><div class="section"><h3>Рекорд</h3></div><div class="grid3"><div class="stat"><small>W-L</small><b>${f.wins}-${f.losses}</b></div><div class="stat"><small>KO/TKO</small><b>${f.ko}</b></div><div class="stat"><small>SUB</small><b>${f.sub}</b></div></div><div class="section"><h3>Характеристики</h3></div><div class="list">${Object.entries(f.stats).map(([k,v])=>`<div class="row"><b>${statName(k)}</b><strong>${v.toFixed(1)}</strong></div>`).join('')}</div><div class="section"><h3>История</h3></div>${game.history.length?game.history.slice(0,12).map(h=>`<div class="row"><b class="${h.result==='WIN'?'win':'loss'}">${h.result}</b><div class="grow"><b>${esc(h.opponent)}</b><div class="muted">${h.method} · ${h.date}</div></div><span>$${h.purse}</span></div>`).join(''):'<div class="muted">Боев ещё не было.</div>'}<div class="actions one"><button onclick="closeModal()">Закрыть</button></div>`}
function statName(k){return {speed:'Скорость',power:'Сила',technique:'Техника',wrestling:'Борьба',grappling:'Грэпплинг',cardio:'Кардио',chin:'Стойкость'}[k]||k}
function settings(){document.getElementById('screen').innerHTML=`<div class="panel"><div class="eyebrow">SYSTEM</div><div class="title">Настройки</div><div class="field"><label>Сложность</label><select id="difficulty" onchange="game.settings.difficulty=this.value;save()"><option ${game.settings.difficulty==='Easy'?'selected':''}>Easy</option><option ${game.settings.difficulty==='Normal'?'selected':''}>Normal</option><option ${game.settings.difficulty==='Hard'?'selected':''}>Hard</option></select></div><div class="field"><label>Звук</label><button onclick="game.settings.sound=!game.settings.sound;save();settings()">${game.settings.sound?'Включён':'Выключен'}</button></div><div class="actions"><button onclick="go(game.created?'career':'menu')">Назад</button><button class="red" onclick="resetGame()">Удалить карьеру</button></div></div>`}
function openLoad(){game.screen='load';render()}
function load(){let active=localStorage.getItem(KEY+'_active');document.getElementById('screen').innerHTML=`<div class="panel"><div class="eyebrow">SAVE DATA</div><div class="title">Загрузить игру</div><div class="muted">Локальные сохранения этого устройства.</div></div><div class="list">${active?`<div class="row"><div class="grow"><b>Последняя карьера</b><div class="muted">${JSON.parse(active).fighter?fighterNameFrom(JSON.parse(active).fighter):'Боец'} · неделя ${JSON.parse(active).week}</div></div><button class="primary" onclick="continueGame()">Загрузить</button></div>`:'<div class="panel muted">Сохранений пока нет.</div>'}</div><div class="actions one"><button onclick="go('menu')">Назад</button></div>`}
function fighterNameFrom(f){return `${f.first} ${f.last}`}
function resetGame(){if(confirm('Удалить текущую карьеру?')){localStorage.removeItem(KEY+'_active');game=baseGame();save();render()}}
function go(s){game.screen=s;save();render()}
function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function toast(t){let el=document.createElement('div');el.textContent=t;el.style.cssText='position:fixed;left:50%;bottom:85px;transform:translateX(-50%);z-index:99;background:#20262e;border:1px solid #454d57;border-radius:9px;padding:11px 14px;font-size:12px';document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
function bottom(){if(!game.created)return;let old=document.querySelector('.bottom');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<nav class="bottom"><button onclick="go('career')" class="active"><b>⌂</b>Карьера</button><button onclick="go('training')"><b>◆</b>Тренировки</button><button onclick="go('fight')"><b>◉</b>Бои</button><button onclick="openProfile()"><b>◎</b>Боец</button><button onclick="go('settings')"><b>⚙</b>Настройки</button></nav>`)}
const oldRender=render;render=function(){oldRender();if(game&&game.created)bottom();else{let b=document.querySelector('.bottom');if(b)b.remove()}};
render();
</script>
</body>
</html>
