<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UFC 6 Fight Tracker</title>
<style>
:root{--bg:#090a0b;--panel:#121416;--panel2:#181a1d;--line:#292c30;--text:#f1f2f3;--muted:#8d9298;--good:#b9d7c2;--bad:#d7b9b9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select{font:inherit}button{border:0;color:inherit;cursor:pointer;touch-action:manipulation}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}header{position:sticky;top:0;z-index:5;background:rgba(9,10,11,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:18px}.brand{font-size:12px;letter-spacing:2px;color:#aeb3b8;font-weight:800}.title{font-size:27px;font-weight:850;margin-top:3px}.sub,.small,.meta{color:var(--muted);font-size:11px}nav{display:flex;gap:6px;overflow:auto;padding:12px 14px 4px}nav button{background:var(--panel);border:1px solid var(--line);padding:9px 13px;border-radius:10px;font-size:12px;white-space:nowrap}nav button.active{background:#e5e7e9;color:#090a0b}main{padding:10px 14px}.card{background:linear-gradient(145deg,#151719,#101214);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:800;text-transform:uppercase}.hero{display:flex;align-items:end;justify-content:space-between}.big{font-size:38px;font-weight:900}.record{font-size:13px;color:#c8cbd0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--panel2);border:1px solid var(--line);padding:11px;border-radius:11px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:var(--muted)}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#34383d,#111);border:1px solid #3a3d40;display:grid;place-items:center;font-weight:900;flex:none}.name{font-weight:800}.rank{font-size:22px;font-weight:900;color:#dfe2e5}.rank small{display:block;font-size:9px;color:var(--muted);text-align:right}.badge{display:inline-block;padding:4px 7px;border-radius:6px;background:#202327;color:#bfc4c9;font-size:9px;font-weight:800}.win{color:var(--good)}.loss{color:var(--bad)}.list{display:flex;flex-direction:column;gap:7px}.row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px;cursor:pointer}.row .grow{flex:1}.search{margin-bottom:9px}input,select{width:100%;background:#0e1012;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}label{font-size:10px;color:var(--muted);display:block;margin:10px 0 5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;margin-top:12px}.primary{background:#e3e5e7;color:#0b0c0d;border-radius:10px;padding:11px 14px;font-weight:800;flex:1}.secondary{background:#222528;border:1px solid var(--line);border-radius:10px;padding:11px 14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 8px}.sectionhead h2{font-size:15px;margin:0}.sectionhead button{background:none;color:#bfc4c9;font-size:11px}footer{position:fixed;bottom:0;left:0;right:0;background:rgba(10,11,12,.97);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}.footerin{width:min(730px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.footerin button{background:transparent;color:#8f9499;font-size:10px;padding:7px}.footerin button.active{color:#f3f4f5}.footerin span{display:block;font-size:17px;margin-bottom:2px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:none;padding:30px 14px;overflow:auto}.modal.show{display:block}.modalbox{max-width:700px;margin:auto;background:#111315;border:1px solid var(--line);border-radius:16px;padding:16px}.close{float:right;background:#222528;border-radius:8px;padding:6px 10px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:10px 0}.tabs button{padding:9px;border-radius:9px;background:#17191b;border:1px solid var(--line);font-size:11px}.tabs button.active{background:#dedfe1;color:#090a0b}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}.formgrid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="app"><header><div class="brand">UFC 6 / PERSONAL TRACKER</div><div class="title">FIGHTER RANKINGS</div><div class="sub">Твои онлайн-результаты, рейтинги и история карьеры</div></header><nav id="weightNav"></nav><main id="content"></main><footer><div class="footerin"><button onclick="go('home')" id="fhome"><span>⌂</span>Главная</button><button onclick="go('rankings')" id="frank"><span>▤</span>Рейтинг</button><button onclick="go('fighters')" id="ffight"><span>◉</span>Бойцы</button><button onclick="go('add')" id="fadd"><span>＋</span>Бой</button></div></footer></div><div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div><script>
const weights=["P4P","Heavyweight","Light Heavyweight","Middleweight","Welterweight","Lightweight","Featherweight","Bantamweight","Flyweight","Women's Bantamweight","Women's Flyweight","Women's Strawweight"];const initial=[["Alex Pereira","Light Heavyweight",1,1,0,1,0,0,1],["Jon Jones","Heavyweight",1,0,0,0,0,0,0],["Tom Aspinall","Heavyweight",2,0,0,0,0,0,0],["Islam Makhachev","Welterweight",1,0,0,0,0,0,0],["Ilia Topuria","Lightweight",2,0,0,0,0,0,0],["Alexander Volkanovski","Featherweight",1,0,0,0,0,0,0],["Khamzat Chimaev","Middleweight",2,0,0,0,0,0,0],["Dricus du Plessis","Middleweight",3,0,0,0,0,0,0],["Merab Dvalishvili","Bantamweight",1,0,0,0,0,0],["Alexandre Pantoja","Flyweight",1,0,0,0,0,0]];let fighters=JSON.parse(localStorage.getItem('ufc6fighters')||'null')||initial.map(x=>({name:x[0],weight:x[1],rank:x[2],wins:x[3],losses:x[4],ko:x[5],sub:x[6],dec:x[7],streak:x[8],defenses:0,titleWins:0,history:[]}));let currentWeight='P4P',page='home',selected=null;const save=()=>localStorage.setItem('ufc6fighters',JSON.stringify(fighters));function nav(){weightNav.innerHTML=weights.map(w=>`<button class="${w===currentWeight?'active':''}" onclick="setWeight('${w.replaceAll("'","\\'")}')">${w}</button>`).join('')}function setWeight(w){currentWeight=w;page='rankings';render()}function go(p){page=p;render()}function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}function getList(){return (currentWeight==='P4P'?fighters:fighters.filter(f=>f.weight===currentWeight)).sort((a,b)=>a.rank-b.rank)}function row(f){return `<div class="row" onclick="openF('${encodeURIComponent(f.name)}')"><div class="rank">${f.rank}<small>RANK</small></div><div class="avatar">${initials(f.name)}</div><div class="grow"><div class="name">${f.name}</div><div class="meta">${f.weight} · ${f.wins}-${f.losses}</div></div><span class="badge">${f.streak?'W'+f.streak:'—'}</span></div>`}function render(){nav();document.querySelectorAll('footer button').forEach(x=>x.classList.remove('active'));let id={home:'fhome',rankings:'frank',fighters:'ffight',add:'fadd'}[page];if(id)document.getElementById(id).classList.add('active');let c=content;if(page==='home')c.innerHTML=`<div class="card"><div class="hero"><div><div class="eyebrow">MY UFC 6 DATABASE</div><div class="big">${fighters.reduce((s,f)=>s+f.wins,0)}-${fighters.reduce((s,f)=>s+f.losses,0)}</div><div class="record">Суммарный результат</div></div><span class="badge">LOCAL DATA</span></div></div><div class="grid"><div class="stat"><b>${fighters.length}</b><span>БОЙЦОВ</span></div><div class="stat"><b>${fighters.reduce((s,f)=>s+f.wins,0)}</b><span>ПОБЕД</span></div><div class="stat"><b>${fighters.reduce((s,f)=>s+f.losses,0)}</b><span>ПОРАЖЕНИЙ</span></div><div class="stat"><b>${fighters.filter(f=>f.defenses>0).length}</b><span>ЗАЩИТ</span></div></div><div class="sectionhead"><h2>Топ P4P</h2><button onclick="setWeight('P4P')">ВСЕ →</button></div><div class="list">${getList().slice(0,5).map(row).join('')}</div>`;if(page==='rankings')c.innerHTML=`<div class="card"><div class="eyebrow">OFFICIAL-STYLE RANKING</div><div class="big">${currentWeight}</div><div class="small">${currentWeight==='P4P'?'Pound-for-pound':'Дивизионный рейтинг'}</div></div><div class="list">${getList().length?getList().map(row).join(''):'<div class="card small">Нет бойцов.</div>'}</div>`;if(page==='fighters')c.innerHTML=`<input class="search" id="search" placeholder="Поиск бойца..." oninput="filterFighters()"><div id="fighterList" class="list">${[...fighters].sort((a,b)=>a.name.localeCompare(b.name)).map(row).join('')}</div>`;if(page==='add')c.innerHTML=`<div class="card"><div class="eyebrow">NEW ONLINE FIGHT</div><h2>Записать результат</h2><label>Боец</label><input id="aname" placeholder="Например, Alex Pereira"><label>Весовая</label><select id="aweight">${weights.filter(w=>w!=='P4P').map(w=>`<option>${w}</option>`).join('')}</select><div class="formgrid"><div><label>Результат</label><select id="ares"><option>WIN</option><option>LOSS</option></select></div><div><label>Метод</label><select id="amethod"><option>KO/TKO</option><option>SUBMISSION</option><option>DECISION</option></select></div><div><label>Серия</label><input id="astreak" type="number" min="0" value="1"></div></div><div class="actions"><button class="primary" onclick="addFight()">Сохранить бой</button><button class="secondary" onclick="go('fighters')">Бойцы</button></div></div>`}function filterFighters(){let q=search.value.toLowerCase();fighterList.innerHTML=fighters.filter(f=>f.name.toLowerCase().includes(q)).map(row).join('')}function addFight(){let name=aname.value.trim();if(!name)return alert('Введите имя бойца');let f=fighters.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!f){f={name,weight:aweight.value,rank:15,wins:0,losses:0,ko:0,sub:0,dec:0,streak:0,defenses:0,titleWins:0,history:[]};fighters.push(f)}f.weight=aweight.value;let res=ares.value,m=amethod.value;if(res==='WIN'){f.wins++;f.streak=+astreak.value||1;if(m==='KO/TKO')f.ko++;if(m==='SUBMISSION')f.sub++;if(m==='DECISION')f.dec++}else{f.losses++;f.streak=0}f.history.unshift({result:res,method:m,weight:f.weight,date:new Date().toLocaleDateString('ru-RU')});save();openF(encodeURIComponent(f.name))}function openF(enc){selected=fighters.find(x=>x.name===decodeURIComponent(enc));if(!selected)return;modal.classList.add('show');modalContent.innerHTML=`<div class="eyebrow">FIGHTER PROFILE</div><div class="hero"><div><div class="big" style="font-size:28px">${selected.name}</div><div class="record">${selected.weight} · #${selected.rank}</div></div><div style="font-size:24px;font-weight:900">${selected.wins}-${selected.losses}</div></div><div class="tabs"><button class="active">OVERVIEW</button><button onclick="editF()">EDIT</button></div><div class="grid"><div class="stat"><b>${selected.wins}</b><span>WINS</span></div><div class="stat"><b>${selected.losses}</b><span>LOSSES</span></div><div class="stat"><b>${selected.streak}</b><span>WIN STREAK</span></div><div class="stat"><b>${selected.defenses}</b><span>TITLE DEFENSES</span></div><div class="stat"><b>${selected.ko}</b><span>KO/TKO</span></div><div class="stat"><b>${selected.sub}</b><span>SUBMISSIONS</span></div><div class="stat"><b>${selected.dec}</b><span>DECISIONS</span></div><div class="stat"><b>${selected.titleWins}</b><span>TITLE WINS</span></div></div><div class="sectionhead"><h2>Fight history</h2></div><div class="list">${selected.history.length?selected.history.map(h=>`<div class="row"><b class="${h.result==='WIN'?'win':'loss'}">${h.result}</b><div class="grow"><div class="name">${h.method}</div><div class="meta">${h.weight} · ${h.date}</div></div></div>`).join(''):'<div class="small">История пока пустая.</div>'}</div>`}function editF(){let f=selected;modalContent.innerHTML=`<div class="eyebrow">EDIT FIGHTER</div><h2>${f.name}</h2><div class="formgrid"><div><label>Весовая</label><select id="eweight">${weights.filter(w=>w!=='P4P').map(w=>`<option ${w===f.weight?'selected':''}>${w}</option>`).join('')}</select></div><div><label>Рейтинг</label><input id="erank" type="number" value="${f.rank}"></div><div><label>Защиты титула</label><input id="edef" type="number" value="${f.defenses}"></div><div><label>Титулы</label><input id="etitle" type="number" value="${f.titleWins}"></div><div><label>Победы</label><input id="ew" type="number" value="${f.wins}"></div><div><label>Поражения</label><input id="el" type="number" value="${f.losses}"></div></div><div class="actions"><button class="primary" onclick="saveEdit()">Сохранить</button><button class="secondary" onclick="closeModal()">Отмена</button></div>`}function saveEdit(){let f=selected;f.weight=eweight.value;f.rank=+erank.value||15;f.defenses=+edef.value||0;f.titleWins=+etitle.value||0;f.wins=+ew.value||0;f.losses=+el.value||0;save();openF(encodeURIComponent(f.name))}function closeModal(){modal.classList.remove('show')}render();
</script></body></html>
